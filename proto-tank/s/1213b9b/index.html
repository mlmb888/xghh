window.addEventListener('unhandledrejection', function(e){ window.__errors.push(String(e.reason&&e.reason.message||e.reason||'reject')); });

let seed=1;
let runSeed=1;
function rnd(){
  seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15, 1|seed);
  t=t+Math.imul(t^t>>>7, 61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;
}
function hash2(a,b){
  let n=Math.imul(a|0, 374761393)+Math.imul(b|0, 668265263);
  n=(n^n>>>13)|0; n=Math.imul(n,1274126177);
  return ((n^n>>>16)>>>0)/4294967296;
}
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function dampAngle(a,b,k){
  let d=b-a;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  return a+d*k;
}
function mile(id){
  if(miles.indexOf(id)<0) miles.push(id);
}
function hasSprite(){ return false; }
function drawSprite(){ return false; }
const battle={ready:false, body:null, mounts:{}, actors:{}};
const lobby={ready:false, layers:[], texts:[], images:{}, s:1, ox:0, oy:0};
let lobbyMsg='', lobbyMsgT=-10;
const MOUNT_GAIN=1.4;
const SHOW_HP=params.get('hp')==='1';
function packRoots(){
  const out=[];
  const q=params.get('art');
  if(q) out.push(q.endsWith('/')?q:q+'/');
  try{ out.push(new URL('../assets/', location.href).href); }catch(err){}
  try{ out.push(new URL('assets/', location.href).href); }catch(err){}
  out.push('/proto-tank/assets/');
  return out;
}
function loadImage(url){
  return new Promise(function(res,rej){
    const img=new Image();
    img.onload=function(){ res(img); };
    img.onerror=function(){ rej(new Error(url)); };
    img.src=url;
  });
}
function fitSprite(def){
  const w=def.size[0], h=def.size[1];
  const sx=def.display[0]/w, sy=def.display[1]/h;
  const ax=def.anchor_pivot[0], ay=def.anchor_pivot[1];
  const rec={w:w,h:h,ax:ax,ay:ay,sx:sx,sy:sy,fps:def.fps||8,frames:def.frames||1,img:null,imgs:[]};
  if(def.muzzle) rec.muzzle={x:(def.muzzle[0]-ax)*sx, y:(def.muzzle[1]-ay)*sy};
  return rec;
}
function loadBattle(root){
  return fetch(root+'battle_p0/manifest.json',{cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('battle '+res.status);
    return res.json();
  }).then(function(json){
    const assets=json.assets||{};
    const jobs=[];
    const bodyDef=assets['jeep_body.png'];
    if(!bodyDef) throw new Error('no jeep body');
    const body=fitSprite(bodyDef);
    body.hardpoints={};
    Object.keys(bodyDef.hardpoints||{}).forEach(function(name){
      const p=bodyDef.hardpoints[name];
      body.hardpoints[name]={x:(p[0]-body.ax)*body.sx, y:(p[1]-body.ay)*body.sy};
    });
    jobs.push(loadImage(root+'battle_p0/jeep_body.png').then(function(img){ body.img=img; battle.body=body; }));
    ['jeep_turret.png','mount_twin_mg.png','mount_rocket_pod.png','mount_flamethrower.png','mount_side_cannon.png'].forEach(function(file){
      const def=assets[file];
      if(!def) return;
      const rec=fitSprite(def);
      battle.mounts[file]=rec;
      jobs.push(loadImage(root+'battle_p0/'+file).then(function(img){ rec.img=img; }));
    });
    ['zombie_walker','zombie_fatty','zombie_runner','survivor_run'].forEach(function(name){
      const def=assets[name+'_[0-3].png'];
      if(!def) return;
      const rec=fitSprite(def);
      battle.actors[name]=rec;
      for(let i=0;i<(def.frames||4);i++){
        jobs.push(loadImage(root+'battle_p0/'+name+'_'+i+'.png').then(function(img){ rec.imgs[i]=img; }));
      }
    });
    return Promise.all(jobs);
  }).then(function(){ battle.ready=!!(battle.body&&battle.body.img); });
}
function loadLobby(root){
  return fetch(root+'lobby_final/layout.json',{cache:'no-store'}).then(function(res){
    if(!res.ok) throw new Error('lobby '+res.status);
    return res.json();
  }).then(function(json){
    lobby.layers=(json.layers||[]).slice().sort(function(a,b){ return a.z-b.z; });
    lobby.texts=json.texts||[];
    const files={};
    lobby.layers.forEach(function(layer){ files[layer.file]=1; });
    return Promise.all(Object.keys(files).map(function(file){
      return loadImage(root+'lobby_final/'+file).then(function(img){ lobby.images[file]=img; });
    }));
  }).then(function(){
    lobby.s=LW/360;
    lobby.ox=0;
    lobby.oy=(LH-640*lobby.s)/2;
    lobby.ready=true;
  });
}
function loadPacks(){
  const roots=packRoots();
  let i=0;
  function next(){
    if(i>=roots.length) return;
    const root=roots[i++];
    loadBattle(root).then(function(){
      art.ready=true; art.base=root; art.err='';
      loadLobby(root).catch(function(err){ lobby.err=String(err&&err.message||err); });
    }).catch(function(err){
      battle.ready=false;
      art.err=String(err&&err.message||err);
      next();
    });
  }
  next();
}
function slotLocal(slot){
  const name=slot==='top'?'roof':slot;
  if(battle.ready && battle.body && battle.body.hardpoints[name]) return battle.body.hardpoints[name];
  const p=SLOT_PIVOT[slot]||[0,0];
  return {x:p[0], y:p[1]};
}
function mountPlan(w){
  const plan={};
  const scatter=w.scatter|0, pierce=w.pierce|0;
  if(scatter){
    plan.top='mount_rocket_pod.png';
    plan.front=pierce?'mount_side_cannon.png':'mount_twin_mg.png';
  }else{
    plan.top=pierce?'mount_side_cannon.png':'jeep_turret.png';
  }
  if(w.sides){ plan.left='mount_side_cannon.png'; plan.right='mount_side_cannon.png'; }
  if(w.rear) plan.rear='mount_twin_mg.png';
  return plan;
}
function drawArtJeep(w){
  const body=battle.body;
  ctx.fillStyle='rgba(90,60,30,.28)';
  ctx.beginPath(); ctx.ellipse(0,10,body.dw*0.34,body.dh*0.36,0,0,7); ctx.fill();
  ctx.save();
  ctx.scale(body.sx, body.sy);
  ctx.drawImage(body.img, -body.ax, -body.ay);
  ctx.restore();
  const plan=mountPlan(w);
  const order=['rear','left','right','front','top'];
  for(let i=0;i<order.length;i++){
    const slot=order[i];
    const file=plan[slot];
    const rec=file&&battle.mounts[file];
    if(!rec||!rec.img) continue;
    const hp=slotLocal(slot);
    const rot=(w===player.weapons?turret[slot]-player.facing:0);
    ctx.save();
    ctx.translate(hp.x, hp.y);
    ctx.rotate(rot);
    ctx.scale(rec.sx*MOUNT_GAIN, rec.sy*MOUNT_GAIN);
    ctx.drawImage(rec.img, -rec.ax, -rec.ay);
    ctx.restore();
  }
  if(SHOW_HP){
    Object.keys(body.hardpoints).forEach(function(name){
      const hp=body.hardpoints[name];
      ctx.fillStyle='#ff3b30';
      ctx.beginPath(); ctx.arc(hp.x, hp.y, 2.2, 0, 7); ctx.fill();
    });
  }
}

function newSeed(){
  const t=(Date.now() ^ Math.floor((performance.now&&performance.now()||0)*1000) ^ Math.floor(Math.random()*0x7fffffff))>>>0;
  return t||1;
}

function worldToScreen(x,y){
  return {x:(x-cam.x)+LW/2, y:LH/2-(y-cam.y)};
}
function sx(x){ return (x-cam.x)+LW/2; }
function sy(y){ return LH/2-(y-cam.y); }
function rectScreen(r){
  return {x:sx(r.x), y:sy(r.y+r.h), w:r.w, h:r.h};
}

function addSolid(o){ o.alive=o.alive!==false; solids.push(o); return o; }
function addWall(x,y,w,h,kind){
  const o=addSolid({x:x,y:y,w:w,h:h,kind:kind||'wall',bullet:true,r:0});
  walls.push(o);
  return o;
}
function addCircle(x,y,r,kind){
  return addSolid({x:x,y:y,r:r,kind:kind||'tree',bullet:true,w:0,h:0});
}
function overlapSolidPoint(x,y,rad,ignoreSoft){
  for(let i=0;i<solids.length;i++){
    const s=solids[i];
    if(!s.alive) continue;
    if(ignoreSoft && s.bullet===false) continue;
    if(s.r){
      if(Math.hypot(x-s.x,y-s.y)<rad+s.r) return s;
    }else{
      const cx=clamp(x,s.x,s.x+s.w), cy=clamp(y,s.y,s.y+s.h);
      if((x-cx)*(x-cx)+(y-cy)*(y-cy)<rad*rad) return s;
    }
  }
  return null;
}
function tryMove(ent,dx,dy,rad){
  ent.x+=dx;
  if(overlapSolidPoint(ent.x,ent.y,rad,false)) ent.x-=dx;
  ent.y+=dy;
  if(overlapSolidPoint(ent.x,ent.y,rad,false)) ent.y-=dy;
}
function los(x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const dist=Math.hypot(dx,dy);
  const steps=Math.max(1,Math.ceil(dist/18));
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(overlapSolidPoint(x1+dx*t, y1+dy*t, 2, true)) return false;
  }
  return true;
}
function inRect(x,y,r){ return r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }

function floatAt(x,y,text,col,big){
  floaters.push({x:x,y:y+10,text:text,col:col||'#fff',life:big?1.15:0.85,age:0,big:!!big,alive:true});
}
function pushFx(p){
  if(particles.length>220) return;
  particles.push(p);
}
function burst(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=rnd()*Math.PI*2, sp=40+rnd()*160;
    pushFx({kind:'dot',x:x,y:y,vx:Math.sin(a)*sp,vy:Math.cos(a)*sp,life:0.25+rnd()*0.35,age:0,r:1.5+rnd()*2.2,col:col||'#ffb21a',alive:true});
  }
}
function sparkAt(x,y,kx,ky){
  const m=Math.hypot(kx||0,ky||0)||1;
  const base=Math.atan2(kx||0, ky||1);
  shake=Math.max(shake, 1.8);
  for(let i=0;i<7;i++){
    const ang=base+(rnd()-0.5)*1.35;
    const sp=90+rnd()*240;
    pushFx({kind:'spark',x:x,y:y,vx:Math.sin(ang)*sp,vy:Math.cos(ang)*sp,life:0.1+rnd()*0.12,age:0,r:1.4,col:i<3?'#fff':'#ffe46b',alive:true});
  }
}
function shatter(x,y,n,cols){
  for(let i=0;i<n;i++){
    const a=rnd()*Math.PI*2, sp=60+rnd()*170;
    pushFx({
      kind:'chunk', x:x, y:y, vx:Math.sin(a)*sp, vy:Math.cos(a)*sp-40,
      life:0.32+rnd()*0.28, age:0, r:2, col:cols[i%cols.length],
      rot:rnd()*6.28, vr:(rnd()-0.5)*14, w:3+rnd()*5, h:2+rnd()*3, alive:true
    });
  }
}
function bleed(x,y){
  const n=2+((rnd()*2)|0);
  for(let i=0;i<n;i++){
    stains.push({
      x:x+(rnd()-0.5)*16, y:y+(rnd()-0.5)*12,
      rot:rnd()*6.28, s:0.65+rnd()*0.85, age:0, life:16+rnd()*8, alive:true
    });
  }
  if(stains.length>70) stains.splice(0, stains.length-70);
}
function dmgNum(x,y,n,elite){
  let alive=0;
  for(let i=0;i<floaters.length;i++) if(floaters[i].alive&&floaters[i].dmg) alive++;
  if(alive>20) return;
  floaters.push({
    x:x+(rnd()-0.5)*10, y:y+(rnd()*6), text:String(Math.max(1,Math.round(n))),
    col:elite?'#ffe46b':'#fff', life:0.62, age:0, big:!!elite||n>=22, alive:true, dmg:true, vy:62
  });
}
function scheduleBoom(x,y,power){

}
function popBoom(ev){
  shake=Math.max(shake, ev.power);
  pushFx({kind:'ring',x:ev.x,y:ev.y,vx:0,vy:0,life:0.34,age:0,r:10,col:'#ffb21a',alive:true});
  pushFx({kind:'flash',x:ev.x,y:ev.y,vx:0,vy:0,life:0.16,age:0,r:18,col:'#fff',alive:true});
  burst(ev.x,ev.y,14,'#ff7a18');
  burst(ev.x,ev.y,8,'#fff4d2');
  shatter(ev.x,ev.y,8,['#ff5410','#ffb21a','#2a211c']);
}

function xpNeed(lv){
  return [0,30,76,140,220,320,440][lv-1] || 99999;
}
function grantXp(n){
  player.xp+=n;
  while(player.level<7 && player.xp>=xpNeed(player.level+1)){
    player.level++;
    const k=(player.level-2)%3;
    if(k%2===0){ player.dmgMul+=0.2; perkNames.push('伤害+20%'); floatAt(player.x,player.y+28,'伤害提升','#ffe46b',true); }
    else { player.rateMul+=0.16; perkNames.push('射速+16%'); floatAt(player.x,player.y+28,'射速提升','#8fe9ff',true); }
    burst(player.x,player.y,14,'#ffe46b');
  }
}
function grantGold(n){
  player.gold+=n;
  if(!player.healed[0] && player.gold>=12){
    player.healed[0]=1;
    player.hp=Math.min(player.hpMax, player.hp+28);
    floatAt(player.x,player.y+36,'应急维修','#9df27a',true);
    burst(player.x,player.y,10,'#3dff8a');
  }else if(!player.healed[1] && player.gold>=32){
    player.healed[1]=1;
    player.hp=Math.min(player.hpMax, player.hp+36);
    floatAt(player.x,player.y+36,'应急维修','#9df27a',true);
    burst(player.x,player.y,12,'#3dff8a');
  }
}

  const gold={zombie:1,spit:5,boom:3,mutant:8,gate:4,part:7,core:10}[e.kind]||2;

function killEnemy(e){
  if(!e.alive) return;
  e.alive=false;
  if(e.solid) e.solid.alive=false;
  const c=foeCenter(e);
  const flesh=e.kind==='zombie'||e.kind==='mutant'||e.kind==='spit'||e.kind==='boom';
  if(flesh){
    shatter(c.x,c.y,e.kind==='mutant'?10:7,['#c45a4a','#6d2430','#d8d2c8','#3d4a32']);
    bleed(c.x,c.y);
  }else if(e.kind==='core'||e.kind==='part'){
    shatter(c.x,c.y,12,['#ff5410','#8a2410','#ffe46b','#2a211c']);
  }else{
    burst(c.x, c.y, 12, '#ff7a18');
  }
  if(e.kind==='boom'||e.kind==='core'||e.kind==='part') scheduleBoom(c.x,c.y,e.kind==='core'?12:e.kind==='part'?7:8);
  else shake=Math.min(8, shake+(e.kind==='gate'?4:1));
  dropLoot(e);
  if(e.kind==='gate'){
    camps[e.camp].open=true;
    floatAt(e.x+40, e.y+20, camps[e.camp].name+'打通', '#3dff8a', true);
    mile('breach');
    mileLog('open '+e.camp);
    if(!campCardGiven){ campCardGiven=true; offerCard(); }
    else if(cardCount<4) offerCard();
  }
  if(e.kind==='part'){
    floatAt(e.x+40, e.y+30, '巨臂扯掉', '#ffe46b', true);
    if(parts.every(function(p){return !p.alive;})){
      core.shielded=false;
      floatAt(core.x, core.y+40, '巨兽露身', '#ff7a18', true);
      burst(core.x, core.y, 20, '#5ff0ff');
    }
  }
  if(e.kind==='core'){
    bossDead=true;
    state='winning';
    winAt=uiTime;
    mileLog('boss down');
  }
}
function hurtTarget(e,dmg,kx,ky){
  if(!e.alive) return 'no';
  if(e.kind==='core' && e.shielded){
    if(simTime-(e.armorT||0)>0.35){
      e.armorT=simTime;
      floatAt(e.x, e.y+36, '甲壳', '#9fd7ff');
    }
    return 'armor';
  }
  e.hp-=dmg;
  e.hitT=0.12;
  if(e.hpGhost==null || e.hpGhost<e.hp) e.hpGhost=e.hp+dmg;
  const soft=e.kind==='zombie'||e.kind==='mutant'||e.kind==='spit'||e.kind==='boom';
  if(soft && kx!=null){
    const m=Math.hypot(kx,ky)||1;
    const pow=e.elite?48:92;
    e.kbx=(kx/m)*pow;
    e.kby=(ky/m)*pow;
  }
  const c=foeCenter(e);
  dmgNum(c.x, c.y+(e.r||8)+4, dmg, !!(e.elite||e.kind==='core'||e.kind==='part'));
  if(e.hp<=0) killEnemy(e);
  return 'hit';
}
const hitLog=[];
function hurtPlayer(d){
  if(player.hurt>0 || !player.alive || state!=='play') return;
  player.hp-=d;
  player.hurt=0.55;
  hitLog.push({t:+simTime.toFixed(2), d:d, hp:Math.round(player.hp)});
  if(hitLog.length>24) hitLog.shift();
  shake=Math.max(shake, 4);
  if(player.hp<=0){
    player.hp=0; player.alive=false;
    state='dying'; dieAt=uiTime;
    burst(player.x,player.y,24,'#ff5410');
    mileLog('dead');
  }
}

function localToWorld(lx,ly){
  const a=player.facing;
  return {
    x:player.x+lx*Math.cos(a)-ly*Math.sin(a),
    y:player.y-lx*Math.sin(a)-ly*Math.cos(a)
  };
}
function spawnBullet(x,y,a,opt){
  if(bullets.length>220) return;
  const sp=opt.speed;
  bullets.push({
    x:x,y:y, vx:Math.sin(a)*sp, vy:Math.cos(a)*sp, speed:sp,
    r:opt.r||4, dmg:opt.dmg, pierce:opt.pierce||0, life:opt.life||0.8,
    friendly:!!opt.friendly, kind:opt.kind||'cyan', alive:true, hit:[],
    homing:opt.homing||0, uid:opt.uid||0, lock:opt.lock||0
  });
}
const SLOT_PIVOT={front:[0,-12],top:[0,-6],left:[-13,2],right:[13,2],rear:[0,13]};
function restAngle(slot){
  const a=player.facing;
  if(slot==='left') return a-Math.PI/2;
  if(slot==='right') return a+Math.PI/2;
  if(slot==='rear') return a+Math.PI;
  return a;
}
function mountRange(slot){
  if(slot==='front') return player.weapons.pierce?360:320;
  if(slot==='top') return 300;
  return 280;
}
function aimRank(e,d){
  if(e.kind==='core' && e.shielded) return -1;
  if(e.kind==='core' || e.kind==='part') return 3000-d;
  if(d<72) return 2500-d;
  if(e.elite) return 2000-d;
  return 1000-d;
}
function pickTarget(x,y,range){
  let best=null, score=-1e9;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive) continue;
    const c=foeCenter(e);
    const d=Math.hypot(c.x-x, c.y-y);
    if(d>range) continue;
    if(!los(x,y,c.x,c.y)) continue;
    const sc=aimRank(e,d);
    if(sc>score){ score=sc; best=e; }
  }
  return best;
}
function foeByUid(id){
  if(!id) return null;
  for(let i=0;i<enemies.length;i++) if(enemies[i].uid===id && enemies[i].alive) return enemies[i];
  return null;
}
function pivotOf(slot){
  const p=slotLocal(slot);
  return localToWorld(p.x, p.y);
}
function muzzleOf(slot, len){
  const hp=slotLocal(slot);
  let mlx=0, mly=-(len||12);
  if(battle.ready){
    const file=mountPlan(player.weapons)[slot];
    const rec=file&&battle.mounts[file];
    if(rec&&rec.muzzle){ mlx=rec.muzzle.x*MOUNT_GAIN; mly=rec.muzzle.y*MOUNT_GAIN; }
  }
  const rot=(turret[slot]||0)-player.facing;
  const ox=mlx*Math.cos(rot)-mly*Math.sin(rot);
  const oy=mlx*Math.sin(rot)+mly*Math.cos(rot);
  const w=localToWorld(hp.x+ox, hp.y+oy);
  w.a=turret[slot];
  return w;
}
function stepTurrets(dt){
  const k=1-Math.exp(-dt*18);
  const slots=['front','top','left','right','rear'];
  for(let i=0;i<slots.length;i++){
    const s=slots[i];
    const o=pivotOf(s);
    const tgt=pickTarget(o.x, o.y, mountRange(s));
    const want=tgt ? Math.atan2(foeCenter(tgt).x-o.x, foeCenter(tgt).y-o.y) : restAngle(s);
    turret[s]=dampAngle(turret[s], want, k);
    while(turret[s]>Math.PI) turret[s]-=Math.PI*2;
    while(turret[s]<-Math.PI) turret[s]+=Math.PI*2;
    turretUid[s]=tgt?tgt.uid:0;
  }
}

    }
  }else if(w.rapid){

    spawnBullet(front.x+4,front.y,a,{speed:700,r:2.8,dmg:dmg*0.85,pierce:0,life:0.9,friendly:true,kind:'cyan',homing:9,uid:turretUid.front,lock:lock});
  }else{
    spawnBullet(front.x,front.y,a,{speed:660,r:3.2,dmg:dmg,pierce:0,life:0.95,friendly:true,kind:'cyan',homing:9,uid:turretUid.front,lock:lock});
  }
  player.muzzle.front=0.07;
  if(w.scatter){
    const n=w.scatter>=2?6:4;

    for(let i=0;i<n;i++){

    }
    player.muzzle.top=0.07;
  }
  if(w.sides){
    const L=muzzleOf('left', 12), R=muzzleOf('right', 12);
    spawnBullet(L.x,L.y,L.a,{speed:640,r:3,dmg:9*player.dmgMul,pierce:0,life:0.78,friendly:true,kind:'side',homing:8,uid:turretUid.left,lock:280});
    spawnBullet(R.x,R.y,R.a,{speed:640,r:3,dmg:9*player.dmgMul,pierce:0,life:0.78,friendly:true,kind:'side',homing:8,uid:turretUid.right,lock:280});
    player.muzzle.left=0.07; player.muzzle.right=0.07;
  }
  if(w.rear){
    const m=muzzleOf('rear', 12);
    spawnBullet(m.x,m.y,m.a,{speed:640,r:3,dmg:10*player.dmgMul,pierce:0,life:0.8,friendly:true,kind:'rear',homing:8,uid:turretUid.rear,lock:280});
    player.muzzle.rear=0.07;
  }
}
function foeCenter(e){
  return {x:e.x+(e.w?e.w*0.5:0), y:e.y+(e.h?e.h*0.5:0)};
}
function foeShoot(e,dt){
  if(!e.range) return;
  e.cd-=dt;
  if(e.cd>0) return;
  const c=foeCenter(e);
  const d=Math.hypot(player.x-c.x, player.y-c.y);
  if(d>e.range || !player.alive) return;
  if(!los(c.x,c.y,player.x,player.y)) return;
  e.cd=e.interval;
  const n=e.burst||1;
  for(let i=0;i<n;i++){
    const ang=Math.atan2(player.x-c.x, player.y-c.y)+(i-(n-1)/2)*(e.spread||0);
    const bk=(e.kind==='spit'||e.kind==='mutant')?'acid':'enemy';
    spawnBullet(c.x,c.y,ang,{speed:e.bspd,r:4.6,dmg:e.bdmg,pierce:0,life:1.6,friendly:false,kind:bk});
  }
}
function hitBullet(b){
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive) continue;
    if(!b.friendly) continue;
    if(b.hit.indexOf(e.uid)>=0) continue;
    let hit=false;
    if(e.w){
      const cx=clamp(b.x,e.x,e.x+e.w), cy=clamp(b.y,e.y,e.y+e.h);
      hit=(b.x-cx)*(b.x-cx)+(b.y-cy)*(b.y-cy)<(b.r+1)*(b.r+1);
    }else hit=Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r;
    if(!hit) continue;
    b.hit.push(e.uid);
    const res=hurtTarget(e, b.dmg, b.vx, b.vy);
    if(res==='armor') burst(b.x,b.y,4,'#9fd7ff');
    else sparkAt(b.x,b.y,b.vx,b.vy);
    if(res==='armor' || b.pierce<=0){ b.alive=false; return true; }
    b.pierce--;
  }
  if(!b.friendly && player.alive && Math.hypot(b.x-player.x,b.y-player.y)<b.r+player.r){
    hurtPlayer(b.dmg);
    b.alive=false;
    burst(b.x,b.y,4,'#ff5410');
    return true;
  }
  if(overlapSolidPoint(b.x,b.y,b.r*0.6,true)){
    b.alive=false;
    burst(b.x,b.y,2,'#9eb6d6');
    return true;
  }
  return false;
}
function homeBullet(b,dt){
  if(!b.homing || !b.friendly) return;
  let e=foeByUid(b.uid);
  if(!e){
    e=pickTarget(b.x,b.y,b.lock||420);
    if(e) b.uid=e.uid;
  }
  if(!e) return;
  const c=foeCenter(e);
  const want=Math.atan2(c.x-b.x, c.y-b.y);
  const cur=Math.atan2(b.vx, b.vy);
  const na=dampAngle(cur, want, 1-Math.exp(-dt*b.homing));
  const sp=b.speed||Math.hypot(b.vx,b.vy)||1;
  b.vx=Math.sin(na)*sp;
  b.vy=Math.cos(na)*sp;
}
function stepBullets(dt){
  for(let i=0;i<bullets.length;i++){
    const b=bullets[i];
    if(!b.alive) continue;
    homeBullet(b, dt);
    const sp=Math.hypot(b.vx,b.vy);
    const steps=Math.max(1,Math.ceil(sp*dt/12));
    const h=dt/steps;
    for(let s=0;s<steps && b.alive;s++){
      b.x+=b.vx*h; b.y+=b.vy*h; b.life-=h;
      if(b.life<=0){ b.alive=false; break; }
      if(b.x<0||b.y<0||b.x>MW||b.y>MH){ b.alive=false; break; }
      if(b.kind==='scatter'){
        b.smoke=(b.smoke||0)-h;
        if(b.smoke<=0){
          b.smoke=0.03;
          pushFx({kind:'flame',x:b.x,y:b.y,vx:-b.vx*0.03,vy:-b.vy*0.03,life:0.16,age:0,r:2.4+rnd()*2.2,col:rnd()<0.45?'#fff1c2':'#ff7a18',alive:true});
        }
      }
      hitBullet(b);
    }
  }
  compact(bullets);
}
function compact(arr){
  let w=0;
  for(let i=0;i<arr.length;i++) if(arr[i].alive) arr[w++]=arr[i];
  arr.length=w;
}

function stepHostages(dt){
  for(let i=0;i<hostages.length;i++){
    const h=hostages[i];
    if(!h.alive || h.boarded) continue;
    const camp=camps[h.camp];
    if(!camp.open) continue;
    if(h.grab){
      const z=foeByUid(h.grab);
      if(!z){ h.grab=0; h.grabT=0; }
      else{
        h.grabT+=dt;
        h.x=z.x; h.y=z.y-8;
        if(h.grabT>9){
          h.alive=false; h.lost=true; survivorLost++;
          floatAt(h.x, h.y+8, '没救到', '#ff7a18', true);
        }
        continue;
      }
    }
    let tx,ty;
    const inside=!h.out;
    if(inside && inRect(player.x,player.y,camp.rect)) h.out=true;
    if(!h.out){
      tx=camp.exit.x; ty=camp.exit.y;
      if(Math.hypot(h.x-tx,h.y-ty)<22) h.out=true;
    }
    if(h.out){ tx=player.x; ty=player.y; }
    const dx=tx-h.x, dy=ty-h.y;
    const d=Math.hypot(dx,dy)||1;
    tryMove(h, dx/d*86*dt, dy/d*86*dt, 8);
    if(Math.hypot(h.x-h.lx,h.y-h.ly)<3) h.stuck+=dt; else { h.stuck=0; h.lx=h.x; h.ly=h.y; }
    if(h.stuck>0.45){
      h.stuck=0;
      tryMove(h, (rnd()-0.5)*40, (rnd()-0.5)*40, 8);
    }
  }
}
function stepBoard(dt){
  boardNear=0;
  for(let i=0;i<hostages.length;i++){
    const h=hostages[i];
    if(!h.alive || h.grab || !camps[h.camp].open) continue;
    if(Math.hypot(h.x-player.x, h.y-player.y)<48) boardNear++;
  }
  const sp=Math.hypot(player.vx, player.vy);
  if(boardNear>0 && sp<28 && player.passengers<player.cap && player.alive && state==='play'){
    boardT+=dt;
    if(boardT>=1.5){
      let n=0;
      for(let i=0;i<hostages.length && player.passengers<player.cap;i++){
        const h=hostages[i];
        if(!h.alive || h.grab || !camps[h.camp].open) continue;
        if(Math.hypot(h.x-player.x, h.y-player.y)<56){
          h.boarded=true; h.alive=false;
          if(player.passengers===0) extractT=72;
          player.passengers++;
          n++;
        }
      }
      boardT=0;
      if(n){
        floatAt(player.x, player.y+24, '上车 +'+n, '#3dff8a', true);
        if(player.passengers>=1) mile('carry');
      }
    }
  }else boardT=Math.max(0, boardT-dt*3);
}
function stepTide(dt){
  const moving=Math.hypot(player.vx,player.vy)>22;
  if(moving) idleT=0; else idleT+=dt;
  tideT-=dt;
  if(tideT>0 || !player.alive) return;
  tideT=idleT>5?4.5:8;
  if(idleT>5){
    addZombie(player.x, Math.max(48, player.y-24));
  }
  let alive=0;
  for(let i=0;i<enemies.length;i++) if(enemies[i].alive && enemies[i].kind==='zombie') alive++;
  if(alive>42) return;
  const y=Math.max(48, player.y-240);
  addZombie(clamp(player.x-70, 42, MW-42), y);
}
function stepExtract(dt){
  if(player.passengers<=0 || !player.alive) return;
  const onPad=Math.hypot(player.x-pad.x, player.y-pad.y)<pad.r-8;
  if(onPad && handoff>0) return;
  extractT-=dt;
  if(extractT>0) return;
  const lost=player.passengers;
  player.passengers=0;
  extractT=0;
  hurtPlayer(26);
  floatAt(player.x, player.y+30, '接应超时 -'+lost, '#ff7a18', true);
}
function stepFoes(dt){
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive) continue;
    e.hitT=Math.max(0,e.hitT-dt);
    if(e.hpMax){
      if(e.hpGhost==null) e.hpGhost=e.hp;
      if(e.hpGhost<e.hp) e.hpGhost=e.hp;
      else e.hpGhost+=(e.hp-e.hpGhost)*(1-Math.exp(-dt*3.1));
    }
    const kb=stepKnock(e,dt);
    if(e.kind==='zombie' || e.kind==='mutant' || e.kind==='boom' || e.kind==='spit'){
      const d=Math.hypot(player.x-e.x,player.y-e.y);
      const chase=e.kind==='spit'?520:(e.kind==='zombie'?680:(e.kind==='mutant'?560:480));
      if(d>e.r+10 && d<chase && e.speed && kb<50){
        tryMove(e,(player.x-e.x)/d*e.speed*dt,(player.y-e.y)/d*e.speed*dt,e.r);
      }
      if(e.kind==='boom'){
        if(d<42 && e.fuse==null) e.fuse=0.42;
        if(e.fuse!=null && e.fuse<10){
          e.fuse-=dt;
          if(e.fuse<=0){
            if(Math.hypot(player.x-e.x,player.y-e.y)<58) hurtPlayer(22);
            e.fuse=99;
            killEnemy(e);
            continue;
          }
        }
      }else if(d<e.r+player.r+3){
        hurtPlayer(e.melee||8);
      }
      if((e.kind==='zombie' || e.kind==='mutant') && e.alive){
        for(let hi=0; hi<hostages.length; hi++){
          const h=hostages[hi];
          if(!h.alive || h.grab || !camps[h.camp].open) continue;
          if(Math.hypot(h.x-e.x, h.y-e.y)<18){
            h.grab=e.uid; h.grabT=0;
            floatAt(h.x, h.y+12, '拦住了', '#ff7a18');
            break;
          }
        }
      }
    }else if(e.kind==='core' && !e.shielded){
      e.radial-=dt;
      if(e.radial<=0){
        e.radial=1.7;
        for(let k=0;k<10;k++){
          spawnBullet(e.x,e.y, k/10*Math.PI*2+simTime,{speed:180,r:4.2,dmg:11,life:1.8,friendly:false,kind:'enemy'});
        }
      }
    }
    if(!(e.kind==='core' && e.shielded)) foeShoot(e,dt);
  }
}
function stepPickups(dt){
  for(let i=0;i<pickups.length;i++){
    const p=pickups[i];
    if(!p.alive) continue;
    const d=Math.hypot(player.x-p.x,player.y-p.y);
    if(d<110){
      const sp=d<28?0:320;
      if(sp){ p.x+=(player.x-p.x)/d*sp*dt; p.y+=(player.y-p.y)/d*sp*dt; }
    }
    if(d<20){
      p.alive=false;
      if(p.k==='xp'){ grantXp(p.n); floatAt(p.x,p.y,'+经验','#8fe9ff'); }
      else { grantGold(p.n); floatAt(p.x,p.y,'+'+p.n+'金币','#ffd23a'); }
    }
  }
  compact(pickups);
}
function stepKnock(e,dt){
  const sp=Math.hypot(e.kbx||0, e.kby||0);
  if(sp<6){ e.kbx=0; e.kby=0; return 0; }
  tryMove(e, e.kbx*dt, e.kby*dt, e.r||8);
  const dmp=Math.exp(-dt*9);
  e.kbx*=dmp; e.kby*=dmp;
  return sp;
}
function stepFx(dt){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    p.age+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    const drag=p.kind==='chunk'?0.9:0.92;
    p.vx*=drag; p.vy*=drag;
    if(p.kind==='chunk') p.vy-=40*dt;
    if(p.vr) p.rot=(p.rot||0)+p.vr*dt;
    if(p.age>=p.life) p.alive=false;
  }
  compact(particles);
  for(let i=0;i<floaters.length;i++){
    const f=floaters[i];
    f.age+=dt; f.y+=dt*(f.vy||28);
    if(f.age>=f.life) f.alive=false;
  }
  compact(floaters);
  for(let i=0;i<stains.length;i++){
    const s=stains[i];
    s.age+=dt;
    if(s.age>=s.life) s.alive=false;
  }
  compact(stains);
  for(let i=0;i<fxEvents.length;i++){
    const ev=fxEvents[i];
    if(ev.alive && uiTime>=ev.t){ ev.alive=false; popBoom(ev); }
  }
  compact(fxEvents);
}

function weaponInterval(){
  const base=player.weapons.rapid?0.075:0.15;
  return base/player.rateMul;
}
function updatePlay(dt){
  simTime+=dt;
  player.hurt=Math.max(0,player.hurt-dt);
  player.flash=Math.max(0,player.flash-dt);
  const mk=['front','top','left','right','rear'];
  for(let mi=0;mi<mk.length;mi++){
    player.muzzle[mk[mi]]=Math.max(0,(player.muzzle[mk[mi]]||0)-dt);
    mountPop[mk[mi]]=Math.max(0,(mountPop[mk[mi]]||0)-dt*1.7);
  }
  if(BOT) botPlay(dt); else humanControl(dt);
  faceMove(dt);
  slidePlayer(dt);
  if(player.alive && state==='play'){
    stepTurrets(dt);
    player.fireCd-=dt;
    if(player.fireCd<=0){
      player.fireCd=weaponInterval();
      firePlayer();
    }
  }
  stepHostages(dt);
  stepBoard(dt);
  stepTide(dt);
  stepFoes(dt);
  stepBullets(dt);
  stepPickups(dt);
  stepFx(dt);
  const onPad=Math.hypot(player.x-pad.x,player.y-pad.y)<pad.r-8;
  if(onPad && player.passengers>0 && player.alive){
    handoff+=dt;
    if(handoff>=0.72){
      const n=player.passengers;
      delivered+=n;
      player.passengers=0;
      handoff=0;
      floatAt(pad.x, pad.y+30, '送达 +'+n, '#ffe46b', true);
      burst(pad.x,pad.y,16,'#3dff8a');
      mileLog('deliver '+delivered);
      offerCard();
    }
  }else handoff=Math.max(0, handoff-dt*3.2);
  stepExtract(dt);
  if(player.y>2720 && parts.some(function(p){return p.alive;})) mile('boss');
  updateCam(dt);
  shake=Math.max(0, shake-dt*14);
}

function humanControl(dt){
  let tx=0, ty=0, held=false;
  if(pointer.down && state==='play'){
    const dx=pointer.x-pointer.ox, dy=pointer.y-pointer.oy;
    const m=Math.hypot(dx,dy);
    if(m>12){
      held=true;
      const sp=player.speed*player.speedMul;
      tx=dx/m*sp;
      ty=-dy/m*sp;
    }
  }
  if(held){ player.vx=tx; player.vy=ty; }
  else { player.vx=0; player.vy=0; }
}
function faceMove(dt){
  const sp=Math.hypot(player.vx, player.vy);
  if(sp<8) return;
  const want=Math.atan2(player.vx, player.vy);
  player.facing=dampAngle(player.facing, want, 1-Math.exp(-dt*26));
}
function slidePlayer(dt){
  const rad=player.r;
  if(overlapSolidPoint(player.x, player.y, rad, false)){
    for(let ring=1; ring<=8; ring++){
      let freed=false;
      for(let i=0;i<8;i++){
        const a=i/8*Math.PI*2;
        const nx=player.x+Math.cos(a)*ring, ny=player.y+Math.sin(a)*ring;
        if(!overlapSolidPoint(nx, ny, rad, false)){ player.x=nx; player.y=ny; freed=true; break; }
      }
      if(freed) break;
    }
  }
  const dx=player.vx*dt, dy=player.vy*dt;
  const dist=Math.hypot(dx,dy);
  if(dist<0.001) return;
  const n=Math.max(1, Math.ceil(dist/3));
  const sx=dx/n, sy=dy/n;
  let blockedX=false, blockedY=false;
  for(let i=0;i<n;i++){
    if(!overlapSolidPoint(player.x+sx, player.y+sy, rad, false)){ player.x+=sx; player.y+=sy; continue; }
    const xok=!overlapSolidPoint(player.x+sx, player.y, rad, false);
    const yok=!overlapSolidPoint(player.x, player.y+sy, rad, false);
    if(xok) player.x+=sx; else blockedX=true;
    if(yok) player.y+=sy; else blockedY=true;
    if(!xok && !yok){
      const tx=sy, ty=-sx;
      if(!overlapSolidPoint(player.x+tx, player.y+ty, rad, false)){ player.x+=tx; player.y+=ty; }
      else if(!overlapSolidPoint(player.x-tx, player.y-ty, rad, false)){ player.x-=tx; player.y-=ty; }
    }
  }
  if(blockedX) player.vx=0;
  if(blockedY) player.vy=0;
}
function updateCam(dt){
  const sp=Math.hypot(player.vx, player.vy);
  let lx, ly;
  if(sp>12){
    lx=player.vx/sp*86;
    ly=player.vy/sp*86;
  }else{
    lx=Math.sin(player.facing)*28;
    ly=Math.cos(player.facing)*28;
  }
  const tx=player.x+lx, ty=player.y+ly;
  const k=1-Math.exp(-dt*8);
  cam.x+=(tx-cam.x)*k;
  cam.y+=(ty-cam.y)*k;
  cam.x=clamp(cam.x, LW/2, MW-LW/2);
  cam.y=clamp(cam.y, LH/2, MH-LH/2);
}

const CARD={
  scatter:{id:'scatter', name:'顶置火箭巢', sub:'车顶扇面，专清尸群', tag:'顶挂点', boss:'对 Boss 有效', col:'#ffb21a'},
  pierce:{id:'pierce', name:'车头重炮', sub:'长炮专打厚甲变异', tag:'前挂点', boss:'对 Boss 有效', col:'#5ff0ff'},
  rapid:{id:'rapid', name:'前甲板速射', sub:'车头换成多管机枪', tag:'前挂点', boss:'对 Boss 有效', col:'#ffffff'},
  scatter2:{id:'scatter2', name:'加装火箭管', sub:'顶巢更宽，弹更多', tag:'顶挂点', boss:'对 Boss 有效', col:'#ff7a18'},
  pierce2:{id:'pierce2', name:'加长炮管', sub:'车头炮管更长', tag:'前挂点', boss:'对 Boss 有效', col:'#9fd7ff'},
  sides:{id:'sides', name:'左右侧炮', sub:'两侧炮塔自动锁敌', tag:'侧挂点', boss:'对 Boss 有效', col:'#9df27a'},
  rear:{id:'rear', name:'车尾机枪', sub:'尾炮自动转向', tag:'尾挂点', boss:'对 Boss 有效', col:'#cfe6ff'},
  engine:{id:'engine', name:'传动强化', sub:'局内移速提高', tag:'局内属性', boss:'', col:'#9df27a'},
  engine2:{id:'engine2', name:'传动再强化', sub:'局内移速再提高', tag:'局内属性', boss:'', col:'#b6ff9a'}
};
function familyOf(id){
  if(id==='scatter'||id==='scatter2') return 'rocket';
  if(id==='pierce'||id==='pierce2') return 'cannon';
  if(id==='engine'||id==='engine2') return 'move';
  return id;
}
function rollCards(){
  const w=player.weapons, pool=[];
  if(!w.scatter) pool.push(CARD.scatter); else if(w.scatter<2) pool.push(CARD.scatter2);
  if(!w.pierce) pool.push(CARD.pierce); else if(w.pierce<2) pool.push(CARD.pierce2);
  if(!w.sides) pool.push(CARD.sides);
  if(!w.rear) pool.push(CARD.rear);
  if(!w.rapid) pool.push(CARD.rapid);
  if(!w.engine) pool.push(CARD.engine); else if(w.engine<2) pool.push(CARD.engine2);
  let list=pool;
  if(lastFam){
    const alt=pool.filter(function(c){return familyOf(c.id)!==lastFam;});
    if(alt.length>=3) list=alt;
  }
  return list.slice(0,3);
}
function offerCard(){
  if(cardCount>=5) return;
  if(state==='cards' || card){ cardQueue++; return; }
  const opts=rollCards();
  if(opts.length<3) return;
  card={opts:opts, t:0, openedAt:uiTime, lock:0.28};
  state='cards';
  player.vx=0; player.vy=0;
  cardCount++;
  mile('cards');
}
function openCards(){ offerCard(); }
function chooseCard(i){
  if(!card || state!=='cards') return;
  if(uiTime-card.openedAt<card.lock) return;
  const c=card.opts[i];
  if(!c) return;
  const w=player.weapons;
  if(c.id==='scatter'){ w.scatter=1; mountPop.top=1; }
  else if(c.id==='scatter2'){ w.scatter=2; mountPop.top=1; }
  else if(c.id==='pierce'){ w.pierce=1; mountPop.front=1; }
  else if(c.id==='pierce2'){ w.pierce=2; mountPop.front=1; }
  else if(c.id==='rapid'){ w.rapid=1; mountPop.front=1; }
  else if(c.id==='sides'){ w.sides=1; mountPop.left=1; mountPop.right=1; }
  else if(c.id==='rear'){ w.rear=1; mountPop.rear=1; }
  else if(c.id==='engine'){ w.engine=1; player.speedMul+=0.12; perkNames.push('移速+12%'); }
  else if(c.id==='engine2'){ w.engine=2; player.speedMul+=0.1; perkNames.push('移速+10%'); }
  lastFam=familyOf(c.id);
  floatAt(player.x, player.y+30, c.name, c.col, true);
  burst(player.x,player.y,18,c.col);
  if(w.scatter && w.pierce){
    floatAt(player.x, player.y+58, '车头炮+火箭巢', '#ffe46b', true);
  }
  card=null;
  state='play';
  player.fireCd=0;
  mileLog('card '+c.id);
}
function starCount(n){
  const ratio=survivorTotal?n/survivorTotal:0;
  if(ratio>=0.95) return 3;
  if(ratio>=0.82) return 2;
  if(ratio>=0.55) return 1;
  return 0;
}
function guidePoint(tx,ty){
  const south=880, north=1090;
  const needCross=(player.y<south && ty>north) || (player.y>north && ty<south);
  if(needCross){
    const left=tx<480;
    return {x:left?240:681, y:player.y<south?820:1120, via:left?'left':'right'};
  }
  if(player.y>=south && player.y<=north){
    const onL=player.x>180 && player.x<300, onR=player.x>620 && player.x<742;
    if(!onL && !onR){
      const left=Math.abs(player.x-240)<Math.abs(player.x-681);
      return {x:left?240:681, y:player.y, via:left?'left':'right'};
    }
  }
  return {x:tx, y:ty, via:''};
}
function nearestSurvivor(){
  let best=null, bd=1e9;
  for(let i=0;i<hostages.length;i++){
    const h=hostages[i];
    if(!h.alive || !camps[h.camp].open) continue;
    const d=Math.hypot(h.x-player.x, h.y-player.y);
    if(d<bd){ bd=d; best=h; }
  }
  return best;
}
function rawGoal(){
  if(!camps.L.gate) return {x:240, y:820, text:'走左桥'};
  if(player.passengers>0) return {x:pad.x, y:pad.y, text:'送到接应直升机'};
  const near=nearestSurvivor();
  if(near){
    if(Math.hypot(near.x-player.x, near.y-player.y)<70) return {x:near.x, y:near.y, text:'停车接幸存者'};
    return {x:near.x, y:near.y, text:'去接幸存者'};
  }
  if(!camps.L.open) return {x:camps.L.gate.x+45, y:camps.L.gate.y+20, text:'打掉西区尸巢'};
  if(aliveHost('L')) return {x:250, y:1540, text:'去西区接幸存者'};
  if(!camps.R.open) return {x:camps.R.gate.x+45, y:camps.R.gate.y+20, text:'打掉东区尸巢'};
  if(aliveHost('R')) return {x:660, y:1580, text:'去东区接幸存者'};
  if(core && core.shielded) return {x:450, y:3040, text:'先拆巨兽双臂'};
  return {x:core?core.x:450, y:core?core.y:3000, text:'打巨兽本体'};
}
function objective(){
  const goal=rawGoal();
  const g=guidePoint(goal.x, goal.y);
  let text=goal.text;
  if(g.via==='left') text='走左桥，'+goal.text;
  else if(g.via==='right') text='走右桥，'+goal.text;
  return {x:g.x, y:g.y, text:text};
}

const bot={phase:'title', t:0, stuck:0, lx:0, ly:0, side:1, unstuck:0, plan:['pierce','scatter'], holdUntil:0};
function botReset(){
  bot.phase='goL'; bot.t=0; bot.stuck=0; bot.lx=player.x; bot.ly=player.y; bot.side=1; bot.unstuck=0; bot.holdUntil=0;
  bot.plan=['pierce','scatter','sides','engine','rear'];
}
function botArrive(x,y){ return Math.hypot(player.x-x,player.y-y)<18; }
function botMove(x,y,aimx,aimy){
  let dx=x-player.x, dy=y-player.y;
  const d=Math.hypot(dx,dy)||1;
  if(bot.unstuck>0){
    const px=-dy/d, py=dx/d;
    dx=px*bot.side; dy=py*bot.side;
  }
  const sp=player.speed*player.speedMul;
  player.vx=dx/d*sp;
  player.vy=dy/d*sp;
  if(aimx!=null) player.facing=Math.atan2(aimx-player.x, aimy-player.y);
  else player.facing=Math.atan2(player.vx,player.vy);
}
function botStrafe(e){
  const c=foeCenter(e);
  const dx=c.x-player.x, dy=c.y-player.y;
  const d=Math.hypot(dx,dy)||1;
  const nx=dx/d, ny=dy/d;
  const tx=-ny*bot.side, ty=nx*bot.side;
  const radial=d>165?0.85:d<115?-1:0.15;
  let vx=tx+nx*radial, vy=ty+ny*radial;
  const m=Math.hypot(vx,vy)||1;
  const sp=player.speed*player.speedMul;
  player.vx=vx/m*sp; player.vy=vy/m*sp;
  player.facing=Math.atan2(dx,dy);
}
function botThreat(){
  let best=null, bd=1e9;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(!e.alive) continue;
    if(e.kind==='gate'||e.kind==='part'||e.kind==='core') continue;
    const c=foeCenter(e);
    const d=Math.hypot(c.x-player.x,c.y-player.y);
    const lim=(e.kind==='spit'||e.kind==='mutant'||e.kind==='boom')?150:78;
    if(d<lim && d<bd){ bd=d; best=e; }
  }
  return best;
}
function botStick(dt){
  if(Math.hypot(player.x-bot.lx,player.y-bot.ly)<10) bot.stuck+=dt; else bot.stuck=0;
  bot.lx=player.x; bot.ly=player.y;
  if(bot.unstuck>0) bot.unstuck-=dt;
  if(bot.stuck>0.55){ bot.stuck=0; bot.unstuck=0.35; bot.side*=-1; }
}
function botGoto(x,y,dt){
  const south=880, north=1090;
  const cross=(player.y<south && y>north) || (player.y>north && y<south);
  if(cross){
    const left=(player.y<south?x:player.x)<480;
    const bx=left?240:681;
    if(player.y<south){
      if(player.y<850 || Math.abs(player.x-bx)>36){ x=bx; y=850; }
      else { x=bx; y=1140; }
    }else if(player.y>1160 || Math.abs(player.x-bx)>36){ x=bx; y=1160; }
    else { x=bx; y=840; }
  }
  const th=botThreat();
  if(th && th.kind==='boom'){
    const c=foeCenter(th);
    const d=Math.hypot(c.x-player.x,c.y-player.y);
    if(d<96){ botStrafe(th); botStick(dt); return false; }
  }
  if(botArrive(x,y)){ player.vx=0; player.vy=0; return true; }
  botMove(x,y); botStick(dt); return false;
}
function aliveHost(camp){
  return hostages.some(function(h){return h.alive && h.camp===camp;});
}
function botPlay(dt){
  bot.t+=dt;
  if(simTime<0.85 && bot.phase==='goL'){
    player.vx=0; player.vy=0;
    if(simTime>0.35) mile('start');
    return;
  }
  if((bot.phase==='goR' || bot.phase==='backL') && camps.L.open && camps.R.open && !aliveHost('L') && !aliveHost('R') && player.passengers===0){
    bot.phase='toBoss'; bot.step=0; bot.t=0;
  }
  if(bot.phase==='goL'){
    const pts=[[450,700],[240,800],[240,1160],[250,1216]];
    const p=pts[Math.min(pts.length-1, bot.step|0)];
    if(botGoto(p[0],p[1],dt)){
      bot.step=(bot.step|0)+1;
      if(bot.step>=pts.length){ bot.phase='gateL'; bot.t=0; mileLog('at gate L'); }
    }
  }else if(bot.phase==='gateL'){
    const g=camps.L.gate;
    if(camps.L.open){
      if(!bot.holdUntil) bot.holdUntil=simTime+1.05;
      player.vx=0; player.vy=0;
      player.facing=Math.atan2(g.x+40-player.x, g.y-player.y);
      if(simTime>=bot.holdUntil){ bot.phase='boardL'; bot.t=0; bot.holdUntil=0; }
    }else if(g.alive){
      const orbit=Math.sin(simTime*2.2)*70;
      botMove(250+orbit, 1168, g.x+45, g.y+20);
      const th=botThreat();
      if(th && th.kind!=='zombie' && Math.hypot(foeCenter(th).x-player.x,foeCenter(th).y-player.y)<120) botStrafe(th);
      botStick(dt);
    }
  }else if(bot.phase==='boardL' || bot.phase==='boardR'){
    const camp=bot.phase==='boardL'?'L':'R';
    if(player.passengers>=player.cap || !aliveHost(camp) || bot.t>26){
      if(player.passengers>=1 && !bot.holdUntil) bot.holdUntil=simTime+0.4;
      if(!bot.holdUntil || simTime>=bot.holdUntil){
        bot.phase=camp==='L'?'toPad1':'toPad2'; bot.t=0; bot.step=0; bot.holdUntil=0;
        mileLog('leave '+camp+' '+player.passengers);
      }else player.vx=player.vy=0;
    }else{
      let h=null, bd=1e9;
      for(let i=0;i<hostages.length;i++){
        const o=hostages[i];
        if(!o.alive || o.camp!==camp) continue;
        const d=Math.hypot(o.x-player.x, o.y-player.y);
        if(d<bd){ bd=d; h=o; }
      }
      if(h && bd>34) botMove(h.x, h.y);
      else player.vx=player.vy=0;
    }
  }else if(bot.phase==='backL'){
    const pts=[[450,1880],[300,1720],[250,1520]];
    const p=pts[Math.min(pts.length-1, bot.step|0)];
    if(botGoto(p[0],p[1],dt)){
      bot.step++;
      if(bot.step>=pts.length){ bot.phase='boardL'; bot.t=0; bot.step=0; }
    }
  }else if(bot.phase==='toPad1'){
    const pts=[[260,1500],[262,1710],[280,1880],[450,1980],[450,2040]];
    const p=pts[Math.min(pts.length-1, bot.step|0)];
    if(botGoto(p[0],p[1],dt)){
      bot.step++;
      if(bot.step>=pts.length){ bot.phase='pad'; bot.t=0; }
    }
  }else if(bot.phase==='pad'){
    botMove(pad.x, pad.y);
    if(botArrive(pad.x,pad.y)){ player.vx=0; player.vy=0; }
    if(player.passengers===0 && state==='play' && bot.t>1.4){
      bot.phase=botAfterCard(); bot.step=0; bot.t=0; bot.holdUntil=0;
      mileLog('pad next '+bot.phase);
    }
  }else if(bot.phase==='goR'){
    const pts=[[681,1900],[681,1760],[660,1560]];
    const p=pts[Math.min(pts.length-1, bot.step|0)];
    if(botGoto(p[0],p[1],dt)){
      bot.step++;
      if(bot.step>=pts.length){ bot.phase='gateR'; bot.t=0; mileLog('at camp R'); }
    }
  }else if(bot.phase==='gateR'){
    const g=camps.R.gate;
    const th=botThreat();
    const heavy=th && th.kind!=='zombie' && Math.hypot(foeCenter(th).x-player.x,foeCenter(th).y-player.y)<120;
    if(heavy) botStrafe(th);
    else if(g.alive){
      const orbit=Math.sin(simTime*2)*40;
      botMove(655+orbit, 1500, g.x+45, g.y+20);
      botStick(dt);
    }else player.vx=player.vy=0;
    if(camps.R.open){
      bot.phase='boardR'; bot.t=0; bot.step=0; bot.holdUntil=0; mileLog('board R');
    }
  }else if(bot.phase==='toPad2'){
    const pts=[[650,1800],[450,1920],[450,2040]];
    const p=pts[Math.min(pts.length-1, bot.step|0)];
    if(botGoto(p[0],p[1],dt)){
      bot.step++;
      if(bot.step>=pts.length){ bot.phase='pad'; bot.t=0; }
    }
  }else if(bot.phase==='toBoss'){
    const pts=[[450,2300],[450,2550],[450,2780]];
    const p=pts[Math.min(pts.length-1, bot.step|0)];
    if(botGoto(p[0],p[1],dt)){
      bot.step++;
      if(bot.step>=pts.length){ bot.phase='parts'; bot.t=0; bot.which=0; mileLog('boss room'); }
    }
  }else if(bot.phase==='parts'){
    const left=parts.filter(function(p){return p.alive;});
    if(!left.length){ bot.phase='core'; bot.t=0; return; }
    const e=left[0];
    const flank=e.x<420 ? {x:400,y:2860} : {x:500,y:2860};
    const c=foeCenter(e);
    if(Math.hypot(player.x-flank.x,player.y-flank.y)>18) botMove(flank.x,flank.y,c.x,c.y);
    else {
      player.vx=Math.sin(simTime*3)*36; player.vy=0;
      player.facing=Math.atan2(c.x-player.x,c.y-player.y);
    }
    botStick(dt);
  }else if(bot.phase==='core'){
    if(!core.alive) return;
    const flank={x:450,y:2800};
    if(Math.hypot(player.x-flank.x,player.y-flank.y)>20) botMove(flank.x,flank.y,core.x,core.y);
    else{
      player.vx=Math.cos(simTime*2.4)*90;
      player.vy=Math.sin(simTime*2.4)*30;
      player.facing=Math.atan2(core.x-player.x, core.y-player.y);
    }
    botStick(dt);
  }
}
function botAfterCard(){
  if(!camps.L.open) return 'goL';
  if(aliveHost('L') && player.passengers<player.cap){
    if(player.y>1100 && player.x<430) return 'boardL';
    return 'backL';
  }
  if(!camps.R.open || aliveHost('R')){
    if(camps.R.open && player.x>520 && player.y>1400 && player.y<1760) return 'boardR';
    return 'goR';
  }
  return 'toBoss';
}
function botCards(){
  if(!card) return;
  if(uiTime-card.openedAt<1.25) return;
  const want=bot.plan.shift() || card.opts[0].id;
  let i=card.opts.findIndex(function(o){return o.id===want;});
  if(i<0) i=0;
  const id=card.opts[i].id;
  chooseCard(i);
  bot.phase=botAfterCard();
  bot.step=0; bot.t=0; bot.holdUntil=0;
  mileLog('next '+bot.phase+' after '+id);
}

function openResult(){
  if(!banked){
    banked=true;
    runStars=starCount(delivered);
    const ratio=survivorTotal?delivered/survivorTotal:0;
    meta.gold+=player.gold;
    const better=runStars>meta.bestStars || (runStars===meta.bestStars && delivered>meta.bestDelivered);
    if(better){
      meta.bestStars=runStars;
      meta.bestDelivered=delivered;
      meta.bestRatio=ratio;
    }
    if(bossDead) meta.bestBoss=1;

function resize(){
  const raw=window.devicePixelRatio||1;
  dpr=Math.min(2.5, Math.max(2, raw));
  const scale=Math.min(window.innerWidth/LW, window.innerHeight/LH);
  canvas.style.width=Math.round(LW*scale)+'px';
  canvas.style.height=Math.round(LH*scale)+'px';
  canvas.width=Math.round(LW*dpr);
  canvas.height=Math.round(LH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function logical(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*LW, y:(e.clientY-r.top)/r.height*LH};
}
canvas.addEventListener('pointerdown', function(e){
  const p=logical(e);
  pointer.id=e.pointerId; pointer.x=p.x; pointer.y=p.y; pointer.ox=p.x; pointer.oy=p.y;
  pointer.down=true; pointer.moved=false;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
canvas.addEventListener('pointermove', function(e){
  if(!pointer.down || e.pointerId!==pointer.id) return;
  const p=logical(e);
  pointer.x=p.x; pointer.y=p.y;
  if(Math.hypot(p.x-pointer.ox,p.y-pointer.oy)>8) pointer.moved=true;
});
function pointerUp(e){
  if(e.pointerId!==pointer.id) return;
  const tap=!pointer.moved;
  pointer.down=false;
  if(tap) onTap(pointer.x, pointer.y);
}
canvas.addEventListener('pointerup', pointerUp);
canvas.addEventListener('pointercancel', pointerUp);
function onTap(x,y){
  for(let i=buttons.length-1;i>=0;i--){
    const b=buttons[i];
    if(x>=b.x && y>=b.y && x<=b.x+b.w && y<=b.y+b.h){ b.fn(); return; }
  }
}

function frame(ts){
  try{
    if(!lastTs) lastTs=ts;
    let raw=Math.min(0.05,(ts-lastTs)/1000);
    lastTs=ts;
    uiTime+=raw;
    fpsAcc+=raw; fpsN++;
    if(fpsAcc>=0.5){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
    if((BOT||IDLE) && state==='title' && uiTime>0.35) startGame();
    if(BOT && state==='cards') botCards();
    if(IDLE && state==='cards' && card && uiTime-card.openedAt>0.35) chooseCard(0);
    if(state==='play' && cardQueue>0 && !card && cardCount<5){ cardQueue--; offerCard(); }
    if(state==='dying' && uiTime-dieAt>0.85) openResult();
    if(state==='winning' && uiTime-winAt>1.05) openResult();
    if(state==='play'){
      acc+=raw*FAST;
      if(acc>0.25) acc=0.25;
      const step=1/60;
      let guard=0;
      const maxStep=Math.ceil(FAST)+3;
      while(acc>=step && guard++<maxStep){
        if(state!=='play'){ acc=0; break; }
        updatePlay(step);
        acc-=step;
      }
    }else{
      stepFx(raw);
      shake=Math.max(0,shake-raw*14);
    }
    draw();
  }catch(err){
    window.__errors.push(String(err&&err.stack||err));
    console.error(err);
  }
  requestAnimationFrame(frame);
}

function txt(s,x,y,size,fill,sw,align,weight){

  if(sw){

  ctx.fillText(s,x,y);
}
function rrPath(x,y,w,h,r){

}
function glass(x,y,w,h,r,a){

function drawGround(){
  const x0=Math.floor((cam.x-LW/2)/48)*48;
  const y0=Math.floor((cam.y-LH/2)/48)*48;
  const x1=cam.x+LW/2+48, y1=cam.y+LH/2+48;
  for(let y=y0;y<y1;y+=48){
    for(let x=x0;x<x1;x+=48){
      if(x<0||y<0||x>=MW||y>=MH) continue;
      const h=hash2(x,y);
      let n=168+Math.floor(h*26);
      if(hash2(x+5,y+9)>0.84) n-=14;

      ctx.fillRect(rs.x,rs.y,rs.w+1,rs.h+1);
      ctx.fillStyle='rgba(90,72,58,.16)';
      ctx.fillRect(rs.x,rs.y+rs.h-1,rs.w,1);
      ctx.fillRect(rs.x+rs.w-1,rs.y,1,rs.h);
    }
  }
  drawRoad(380,40,140,860);
  drawRoad(190,900,120,400);
  drawRoad(600,900,140,430);
  drawRoad(300,1680,300,420);
  drawRoad(360,2100,180,620);

function drawRoad(x,y,w,h){
  const r=rectScreen({x:x,y:y,w:w,h:h});
  ctx.fillStyle='#b7aea3';
  ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.fillStyle='rgba(255,248,236,.42)';
  ctx.fillRect(r.x+2,r.y+2,Math.max(0,r.w-4),2);
  ctx.fillStyle='rgba(90,72,58,.28)';
  const vert=h>=w;
  const span=vert?r.h:r.w;
  const n=Math.max(2, Math.floor(span/28));
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n;
    if(vert) ctx.fillRect(r.x+r.w*0.5-1.5, r.y+t*r.h, 3, 10);
    else ctx.fillRect(r.x+t*r.w, r.y+r.h*0.5-1.5, 10, 3);
  }
}
function drawWaters(){
  for(let i=0;i<waters.length;i++){
    const w=waters[i], r=rectScreen(w);
    const g=ctx.createLinearGradient(r.x,r.y,r.x,r.y+r.h);
    g.addColorStop(0,'#8fd4ea');
    g.addColorStop(0.45,'#3d9ec4');
    g.addColorStop(1,'#2c7ea3');

    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle='rgba(230,248,255,.75)';

    const off=(uiTime*46)%28;
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x,r.y,r.w,r.h); ctx.clip();
    for(let k=-1;k<8;k++){
      const yy=r.y+k*28+off;
      ctx.beginPath();
      ctx.moveTo(r.x+8,yy);
      ctx.bezierCurveTo(r.x+r.w*0.3,yy-4,r.x+r.w*0.6,yy+4,r.x+r.w-8,yy);

function drawBridge(b){

  }
  ctx.fillStyle='#5ff0ff';
  ctx.fillRect(r.x+4,r.y+6,4,4);

function drawCircleSolid(s){
  if(!s.r || (s.kind!=='tree' && s.kind!=='rock')) return;
  const p=worldToScreen(s.x,s.y);
  if(p.x<-40||p.y<-40||p.x>LW+40||p.y>LH+40) return;
  ctx.save();
  ctx.translate(p.x,p.y);
  if(s.kind==='tree'){

function drawMuzzles(){

  for(let i=0;i<slots.length;i++){

    const k=(player.muzzle[s[0]]||0)/0.07;
    if(k<=0) continue;
    const m=muzzleOf(s[0], s[1]);
    const p=worldToScreen(m.x,m.y);
    if(drawSprite('muzzle', p.x, p.y, {rot:m.a, scale:0.7+k*0.6, alpha:k})) continue;
    const dx=Math.sin(m.a), dy=-Math.cos(m.a);

    ctx.lineTo(p.x+dy*4.5, p.y-dx*4.5);
    ctx.lineTo(p.x-dy*4.5, p.y+dx*4.5);

    ctx.fillStyle='#ff7a18';

function drawBullet(b){
  const p=worldToScreen(b.x,b.y);
  const sp=Math.hypot(b.vx,b.vy)||1;
  const ux=b.vx/sp, uy=-b.vy/sp;
  const ang=Math.atan2(b.vx,b.vy);
  const spriteId=b.kind==='lance'?'lance':b.kind==='scatter'?'rocket':b.kind==='acid'?'acid':(b.friendly?'tracer':'');
  if(spriteId && drawSprite(spriteId, p.x, p.y, {rot:ang})) return;
  ctx.save();
  ctx.lineCap='round';
  if(b.kind==='lance'){
    ctx.strokeStyle='rgba(20,24,32,.45)'; ctx.lineWidth=10;
    ctx.beginPath(); ctx.moveTo(p.x+ux*10,p.y+uy*10); ctx.lineTo(p.x-ux*36,p.y-uy*36); ctx.stroke();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='#7af0ff'; ctx.lineWidth=6; ctx.stroke();
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(p.x+ux*8,p.y+uy*8); ctx.lineTo(p.x-ux*26,p.y-uy*26); ctx.stroke();
  }else if(b.kind==='scatter'){
    ctx.strokeStyle='rgba(40,16,8,.4)'; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(p.x+ux*6,p.y+uy*6); ctx.lineTo(p.x-ux*16,p.y-uy*16); ctx.stroke();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='#ffb21a'; ctx.lineWidth=5; ctx.stroke();
    ctx.strokeStyle='#fff6d0'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(p.x+ux*5,p.y+uy*5); ctx.lineTo(p.x-ux*10,p.y-uy*10); ctx.stroke();
  }else if(b.kind==='acid'){
    ctx.fillStyle='#1a2408';
    ctx.beginPath(); ctx.arc(p.x,p.y,b.r+1.5,0,7); ctx.fill();
    ctx.fillStyle='#c6e24a';
    ctx.beginPath(); ctx.arc(p.x,p.y,b.r,0,7); ctx.fill();
    ctx.fillStyle='#f4ffb0';
    ctx.beginPath(); ctx.arc(p.x-1,p.y-1,1.3,0,7); ctx.fill();
  }else if(b.kind==='side' || b.kind==='rear'){
    ctx.strokeStyle='rgba(16,24,32,.4)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(p.x+ux*5,p.y+uy*5); ctx.lineTo(p.x-ux*16,p.y-uy*16); ctx.stroke();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=b.kind==='side'?'#b6ff9a':'#e7f4ff'; ctx.lineWidth=3.4; ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(p.x+ux*4,p.y+uy*4); ctx.lineTo(p.x-ux*10,p.y-uy*10); ctx.stroke();
  }else if(b.kind==='enemy'){
    ctx.fillStyle='#5a1c06';
    ctx.beginPath(); ctx.arc(p.x,p.y,b.r+1.6,0,7); ctx.fill();
    ctx.fillStyle='#ff5410';
    ctx.beginPath(); ctx.arc(p.x,p.y,b.r,0,7); ctx.fill();
    ctx.fillStyle='#fff4d2';
    ctx.beginPath(); ctx.arc(p.x-1,p.y-1,1.4,0,7); ctx.fill();
  }else{
    ctx.strokeStyle='rgba(16,24,32,.4)'; ctx.lineWidth=6.5;
    ctx.beginPath(); ctx.moveTo(p.x+ux*8,p.y+uy*8); ctx.lineTo(p.x-ux*22,p.y-uy*22); ctx.stroke();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='#c8f4ff'; ctx.lineWidth=3.6; ctx.stroke();
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(p.x+ux*6,p.y+uy*6); ctx.lineTo(p.x-ux*14,p.y-uy*14); ctx.stroke();
  }

}

function gunLabel(){
  const w=player.weapons, bits=[];
  if(w.pierce>=2) bits.push('长炮');
  else if(w.pierce) bits.push('重炮');
  else if(w.rapid) bits.push('速射');

  glass(36,268,LW-72,250,16,0.88);
  txt('安全送达', LW/2, 304, 16, '#cfe6ff', 3);
  txt(delivered+' / '+survivorTotal, LW/2, 348, 36, '#ffe46b', 6);
  txt('本局金币 +'+player.gold, LW/2, 398, 18, '#ffd23a', 3);
  txt('最佳 '+meta.bestStars+' 星 / '+meta.bestDelivered+' 人', LW/2, 434, 16, '#fff', 3);
  txt(bossDead?'巨兽已击败':'巨兽未击败', LW/2, 474, 16, bossDead?'#3dff8a':'#ff7a18', 3);
  txt('1星 55%   2星 82%   3星 95%', LW/2, 548, 13, '#8eb6ee', 2);
  lightBtn(48, 590, LW-96, 56, '再走一趟', 'g', startGame, 22);
  txt('局外金币 '+meta.gold+'    移速 Lv.'+meta.speedLv, LW/2, 680, 14, '#9df27a', 2);
}

function draw(){
  buttons.length=0;
  const shx=Math.sin(uiTime*47)*shake, shy=Math.cos(uiTime*39)*shake;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#100e0c';
  ctx.fillRect(0,0,LW,LH);
  if(state==='title'){ drawTitle(); return; }
  ctx.save();
  ctx.translate(shx,shy);
  drawGround();
  drawWaters();
  for(let i=0;i<walls.length;i++) drawWall(walls[i]);
  for(let i=0;i<solids.length;i++) if(solids[i].r) drawCircleSolid(solids[i]);
  for(let i=0;i<decos.length;i++) drawDeco(decos[i]);
  drawHeli();
  if(handoff>0){
    const p=worldToScreen(pad.x,pad.y);
    ctx.strokeStyle='#ffe46b'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(p.x,p.y,pad.r-6,-Math.PI/2,-Math.PI/2+handoff/0.72*Math.PI*2); ctx.stroke();
    txt('交接', p.x, p.y-8, 16, '#fff', 3);
  }
  for(let i=0;i<pickups.length;i++){
    const p=pickups[i], s=worldToScreen(p.x,p.y);
    if(p.k==='gold'){
      ctx.fillStyle='#f5b72a'; ctx.beginPath(); ctx.arc(s.x,s.y,6,0,7); ctx.fill();
      ctx.strokeStyle='#ffe08a'; ctx.lineWidth=1.2; ctx.stroke();
    }else{
      ctx.fillStyle='#5ff0ff';
      ctx.beginPath(); ctx.moveTo(s.x,s.y-6); ctx.lineTo(s.x+5,s.y); ctx.lineTo(s.x,s.y+6); ctx.lineTo(s.x-5,s.y); ctx.fill();
    }
  }
  for(let i=0;i<hostages.length;i++) drawHostage(hostages[i]);
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    if(e.kind==='gate'){ drawGate(e); continue; }
    if(!e.alive && e.kind!=='gate') continue;
    if(e.kind==='zombie'||e.kind==='mutant') drawZombie(e);
    else if(e.kind==='spit') drawSpit(e);
    else if(e.kind==='boom') drawBoom(e);
    else if(e.kind==='part') drawArm(e);
    else if(e.kind==='core') drawCore(e);
  }
  if(player.alive || state==='dying'){
    const flash=player.hurt>0 && Math.sin(uiTime*40)>0;
    if(!flash) drawJeepWorld(player.x,player.y,player.facing,player.weapons);
    drawMuzzles();
    if(player.passengers>0){
      const b=localToWorld(0,16);
      const p=worldToScreen(b.x,b.y);
      ctx.fillStyle='#ffc21a';
      ctx.beginPath(); ctx.arc(p.x,p.y,11,0,7); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke();
      txt(String(player.passengers), p.x, p.y, 12, INK, 0);
    }
    if(boardT>0 || boardNear>0){
      const p=worldToScreen(player.x, player.y);
      ctx.strokeStyle='rgba(61,255,138,.35)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,36,0,7); ctx.stroke();
      ctx.strokeStyle='#3dff8a'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(p.x,p.y,36,-Math.PI/2,-Math.PI/2+(boardT/1.5)*Math.PI*2); ctx.stroke();
    }
    if(player.speedMul>1.05 && Math.hypot(player.vx,player.vy)>40){
      const p=worldToScreen(player.x,player.y);
      ctx.globalAlpha=0.45;
      ctx.fillStyle='#9df27a';
      ctx.beginPath(); ctx.ellipse(p.x,p.y+16,8,4,0,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  for(let i=0;i<bullets.length;i++) if(bullets[i].alive) drawBullet(bullets[i]);
  for(let i=0;i<enemies.length;i++) drawOverhead(enemies[i]);
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    const s=worldToScreen(p.x,p.y);
    const a=1-p.age/p.life;
    ctx.globalAlpha=Math.max(0,a);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(s.x,s.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let i=0;i<floaters.length;i++){
    const f=floaters[i];
    const s=worldToScreen(f.x,f.y);
    const a=1-f.age/f.life;
    ctx.globalAlpha=Math.max(0,a);
    txt(f.text, s.x, s.y, f.big?22:14, f.col, f.big?4:3);
  }
  ctx.globalAlpha=1;
  if(DEBUG){
    ctx.strokeStyle='rgba(255,0,0,.45)';
    for(let i=0;i<solids.length;i++){
      const s=solids[i];
      if(!s.alive) continue;
      if(s.r){ ctx.beginPath(); ctx.arc(sx(s.x),sy(s.y),s.r,0,7); ctx.stroke(); }
      else { const r=rectScreen(s); ctx.strokeRect(r.x,r.y,r.w,r.h); }
    }
  }
  ctx.restore();
  drawHUD();
  drawStick();
  if(state==='cards' && card){
    card.t+=1/60;
    drawCards();
  }
  if(state==='result') drawResult();
  if(state==='play' && simTime<3.4){
    txt(objective().text, LW/2, LH*0.7, 18, '#fff', 4);
  }
}

window.__protoTank={
  get:function(){
    return {
      state:state,
      delivered:delivered,
      boss:bossDead,
      shielded:!!(core&&core.shielded),
      parts:parts.filter(function(p){return p.alive;}).length,
      passengers:player.passengers,
      hp:Math.round(player.hp),
      x:Math.round(player.x), y:Math.round(player.y),
      miles:miles.slice(),
      errors:window.__errors.slice(),
      fps:Math.round(fps),
      level:player.level,
      gold:player.gold,
      weapons:Object.assign({}, player.weapons),
      leftOpen:camps.L.open,
      rightOpen:camps.R.open,
      cards:card?card.opts.map(function(o){return o.id;}):null,
      bossTags:card?card.opts.map(function(o){return o.boss||'';}):[],
      phase:bot.phase,
      t:+simTime.toFixed(2),
      facing:+player.facing.toFixed(3),
      vx:Math.round(player.vx), vy:Math.round(player.vy),
      speed:Math.round(player.speed*player.speedMul),
      turret:+turret.front.toFixed(3),
      obj:objective().text,
      ox:Math.round(objective().x), oy:Math.round(objective().y),
      cap:player.cap, total:survivorTotal, stars:runStars,
      extract:+extractT.toFixed(1), board:+boardT.toFixed(2),
      cardsN:cardCount, seed:runSeed,
      artReady:battle.ready, lobby:lobby.ready, artBase:art.base||'', artErr:art.err||'',
      log:log.slice(-12),
      perks:perkNames.slice(),
      hits:hitLog.slice(-12)
    };
  }
};

resize();
window.addEventListener('resize', resize);
loadPacks();
requestAnimationFrame(frame);
})();
</script>
