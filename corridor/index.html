<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>走廊试玩 v3 · 星港护航</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#02030a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  /* 画布必须是 absolute。fixed 会和手机地址栏 / visualViewport 打架。 */
  #c{position:absolute;display:block;touch-action:none;background:#070914}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
 * 星港护航 · 走廊试玩 v3（隔离原型）
 * 不参与 build/build.py，不替换线上根目录 index.html。
 * 镜头锁在方舟上：方舟固定在画面中下方，星域向下滚。
 * 开阔星域，战机只在这一屏里飞。护航＝飞到受威胁的一侧开火。
 * 硬撞和用身体挡弹会掉战机的血，普通敌人撞不死。
 * 胜：方舟抵达检查点。负：方舟被毁。一局约 76 秒。
 * 调试：?dbg=1&bot=1&t=8&go=1&seed=7  撞击对照：bot=ram
 */
const Q=new URLSearchParams(location.search);
const DBG=Q.get('dbg')==='1';
if(DBG&&Q.get('seed')){let _s=(+Q.get('seed')||1)>>>0;Math.random=()=>{_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const BOT_MODE=DBG?(Q.get('bot')||''):'';
const BOT=BOT_MODE==='1'||BOT_MODE==='shoot'||BOT_MODE==='ram';
const BOT_RAM=BOT_MODE==='ram';
const TIMESCALE=DBG?Math.min(8,Math.max(1,+(Q.get('t')||1)||1)):1;
const FONT='"WenQuanYi Micro Hei","Droid Sans Fallback","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif';
const OUT='#1d1747';

const LW=390;
const ARK_SPEED=86;
const GOAL=ARK_SPEED*76;
const PLAYER_SPEED=470;
const ARK_MAX=240;
const FIGHTER_MAX=100;
const MAX_E=16;
const ARK_K=0.68;
const RANGE=206;
const WING_RANGE=148;
const BODY=16;
const LANE=176;
const LEAK={left:'左侧漏了',right:'右侧漏了',front:'前方漏了',back:'后方漏了'};

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let DPR=1,SCALE=1,OFFX=0,OFFY=0,CSS_W=390,CSS_H=760,LH=760,FOCUS=760*ARK_K;
let safe={top:0,bot:0};
let state='title';
let clock=0,demoT=0,shake=0,shakeX=0,shakeY=0;
let tip={txt:'',t:0},saidGate=false;
let endTitle='',endSub='';
let draggedOnce=false;
let fireCd=0,floatT=0,blipT=0;
const cam={x:0,y:0};
const ark={x:0,y:0,hp:ARK_MAX,hit:0,cab:[0,0,0],leak:null};
const player={ox:0,oy:110,x:0,y:0,aim:Math.PI/2,bank:0,flash:0,hp:FIGHTER_MAX,ifr:0,hitstun:0,stun:0,blockT:0};
let wings=[];
const enemies=[],pbullets=[],ebullets=[],parts=[],nums=[],warns=[];
const stats={flank:0,fan:0,brute:0,kills:0,blocks:0,rams:0,leaks:0,stuns:0,hull:0};
const sp={flank:0.35,fan:4.6,brute:16,side:-1};
const held=Object.create(null);
let drag=null,uiDown=null,pauseBtns=null,tgt=null;
const stars=[];
for(let i=0;i<140;i++)stars.push({sx:Math.random()*460-30,sy:Math.random()*980,z:0.2+Math.random()*0.8,r:0.4+Math.random()*1.6});
function h32(i){let t=Math.imul(i^0x9e3779b9,0x85ebca6b);t=Math.imul(t^t>>>13,0xc2b2ae35);return ((t^t>>>16)>>>0)/4294967296}
const rocks=[];
for(let i=0;i<42;i++){
  const side=i%2?1:-1, h=h32(i+3), h2=h32(i+81);
  rocks.push({x:side*(188+h*26), y:120+Math.floor(i/2)*300+h2*70, r:7+h2*7, rot:h*6.28, n:5+(i%3), cover:0});
}
for(let i=0;i<11;i++){
  const side=i%2?1:-1, h=h32(i+210);
  rocks.push({x:side*(72+h*34), y:320+i*580, r:15+h*11, rot:h*6.28, n:6, cover:1});
}
let actx=null,audioOk=false;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
function damp(a,b,k,dt){return a+(b-a)*(1-Math.exp(-k*dt))}
function angDelta(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
function sideOf(dx,dy){
  const a=Math.atan2(dy,dx);
  let best='front',bd=99;
  for(const [n,ang] of [['right',0],['front',Math.PI/2],['left',Math.PI],['back',-Math.PI/2]]){
    const d=Math.abs(angDelta(ang,a));
    if(d<bd){bd=d;best=n}
  }
  return best;
}

function readSafe(){
  const d=document.createElement('div');
  d.style.cssText='position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(d);
  const cs=getComputedStyle(d);
  const sc=SCALE||1;
  safe.top=Math.min(48,(parseFloat(cs.paddingTop)||0)/sc);
  safe.bot=Math.min(40,(parseFloat(cs.paddingBottom)||0)/sc);
  d.remove();
}
function resize(){
  const vv=window.visualViewport;
  const vw=Math.round(vv?vv.width:innerWidth);
  const vh=Math.round(vv?vv.height:innerHeight);
  const offL=vv?vv.offsetLeft:0, offT=vv?vv.offsetTop:0;
  const aspect=vw/Math.max(1,vh);
  let cssW,cssH,left,top;
  if(aspect>0.62){
    cssH=vh; cssW=Math.round(vh*390/760);
    if(cssW>vw){cssW=vw; cssH=Math.round(vw*760/390)}
    left=offL+Math.floor((vw-cssW)/2);
    top=offT+Math.floor((vh-cssH)/2);
  }else{
    cssW=vw; cssH=vh; left=offL; top=offT;
  }
  const d0=window.devicePixelRatio||1;
  DPR=Math.min(d0,d0>=2.5?2.5:2);
  const rawH=390*(cssH/Math.max(1,cssW));
  LH=Math.max(700,Math.min(940,rawH));
  SCALE=cssW/LW;
  const usedH=LH*SCALE;
  OFFX=(cssW-LW*SCALE)/2;
  OFFY=(cssH-usedH)/2;
  FOCUS=LH*ARK_K;
  CSS_W=cssW; CSS_H=cssH;
  cv.style.position='absolute';
  cv.style.left=left+'px';
  cv.style.top=top+'px';
  cv.style.width=cssW+'px';
  cv.style.height=cssH+'px';
  const bw=Math.max(1,Math.round(cssW*DPR)), bh=Math.max(1,Math.round(cssH*DPR));
  if(cv.width!==bw||cv.height!==bh){cv.width=bw; cv.height=bh}
  readSafe();
  drag=null;
}
if(window.visualViewport){
  visualViewport.addEventListener('resize',resize);
  visualViewport.addEventListener('scroll',resize);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));
addEventListener('pageshow',resize);

function w2s(x,y){return [(x-cam.x)+LW/2,(cam.y-y)+FOCUS]}
function s2w(sx,sy){return [sx-LW/2+cam.x, cam.y-(sy-FOCUS)]}
function lockCam(){cam.x=ark.x; cam.y=ark.y}
function offBounds(pad){
  const top=safe.top+118, bot=LH-safe.bot-22, left=8+pad, right=LW-8-pad;
  return {
    minX:left-LW/2+12, maxX:right-LW/2-12,
    minY:FOCUS-bot+12, maxY:FOCUS-top-12
  };
}
function clampOff(){
  const b=offBounds(0);
  player.ox=clamp(player.ox,b.minX,b.maxX);
  player.oy=clamp(player.oy,b.minY,b.maxY);
}
function syncPlayer(){player.x=ark.x+player.ox; player.y=ark.y+player.oy}
function wingAt(w){
  const b=offBounds(0);
  return {
    x:ark.x+clamp(player.ox+w.ox,b.minX,b.maxX),
    y:ark.y+clamp(player.oy+w.oy,b.minY,b.maxY)
  };
}
function layout(){
  const dy=(LH-760)*0.32;
  const cardY=268+dy, cardH=228;
  return {
    card:{x:36,y:cardY,w:318,h:cardH},
    start:{x:70,y:cardY+cardH+16,w:250,h:64,label:'出发'},
    retry:{x:70,y:LH*0.56,w:250,h:60,label:'再试一次'},
    back:{x:108,y:LH*0.56+74,w:174,h:46,label:'返回'},
    pause:{x:LW-52,y:safe.top+12,w:40,h:40,label:'暂停'}
  };
}
function hit(b,x,y){return !!b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h}
function toLogical(e){
  const r=cv.getBoundingClientRect();
  return [(e.clientX-r.left-OFFX)/SCALE,(e.clientY-r.top-OFFY)/SCALE];
}
function toast(s,life){tip.txt=s; tip.t=life||2.2}
function unlockAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!actx)actx=new AC();
    if(actx.state==='suspended')actx.resume();
    audioOk=true;
  }catch(e){}
}
function blip(f,d,g){
  if(!audioOk||!actx||clock-blipT<0.045)return;
  blipT=clock;
  try{
    const o=actx.createOscillator(),n=actx.createGain();
    o.type='triangle'; o.frequency.value=f;
    n.gain.value=g;
    n.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
    o.connect(n); n.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+d);
  }catch(e){}
}

function resetRun(){
  clock=0; shake=0; saidGate=false; fireCd=0; floatT=0;
  endTitle=''; endSub=''; draggedOnce=false; tgt=null;
  ark.x=0; ark.y=0; ark.hp=ARK_MAX; ark.hit=0; ark.cab=[0,0,0]; ark.leak=null;
  player.ox=0; player.oy=128; player.aim=Math.PI/2; player.bank=0; player.flash=0;
  player.hp=FIGHTER_MAX; player.ifr=0; player.hitstun=0; player.stun=0; player.blockT=0;
  wings=[{ox:-46,oy:-4,cd:0.08,aim:Math.PI/2,kind:'sand',guard:3,guardT:0},{ox:46,oy:2,cd:0.18,aim:Math.PI/2,kind:'teal',guard:3,guardT:0}];
  enemies.length=0; pbullets.length=0; ebullets.length=0; parts.length=0; nums.length=0; warns.length=0;
  stats.flank=stats.fan=stats.brute=stats.kills=stats.blocks=stats.rams=stats.leaks=stats.stuns=stats.hull=0;
  sp.flank=0.35; sp.fan=3.2; sp.brute=14; sp.side=-1;
  lockCam(); syncPlayer();
  tip.t=0;
}
function begin(){resetRun(); state='play'}

function burst(x,y,col,n,spd){
  for(let i=0;i<n;i++){
    if(parts.length>100)parts.shift();
    const a=Math.random()*Math.PI*2, v=spd*(0.35+Math.random());
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:0.25+Math.random()*0.22,col,s:1.6+Math.random()*2.2});
  }
}
function floater(x,y,txt,col,life,size,force){
  if(!force){
    if(clock-floatT<0.1)return;
    floatT=clock;
  }
  if(nums.length>12)nums.shift();
  nums.push({x,y,txt,col,t:0,life:life||0.65,size:size||15});
}
function hurtArk(n,src){
  ark.hp=Math.max(0,ark.hp-n);
  ark.hit=0.2;
  ark.cab[(Math.random()*3)|0]=0.7;
  shake=Math.min(9,shake+2.4);
  const dx=(src?src.x:ark.x)-ark.x, dy=(src?src.y:ark.y+40)-ark.y;
  const side=sideOf(dx,dy);
  ark.leak={side,t:1.05};
  stats.leaks++;
  blip(110,0.09,0.05);
  try{if(navigator.vibrate)navigator.vibrate(16)}catch(e){}
  if(ark.hp>0&&ark.hp/ARK_MAX<0.34)toast('方舟危急',1.2);
}
function hurtFighter(n,x,y,label){
  if(player.stun>0)return;
  player.hp=Math.max(0,player.hp-n);
  player.flash=0.2;
  stats.hull+=n;
  floater(x,y-16,label||('-'+n),'#ff8b9a',0.8,16,true);
  blip(150,0.07,0.045);
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}
  if(player.hp<=0){
    player.hp=36;
    player.stun=2.05;
    player.hitstun=2.05;
    player.ifr=0.4;
    stats.stuns++;
    toast('战机重伤',1.3);
    burst(player.x,player.y,'#ff8899',14,170);
    player.ox*=0.35; player.oy=Math.min(player.oy,70);
  }
}
function wingGuard(x,y){
  stats.blocks++;
  burst(x,y,'#b7ffe4',7,110);
  floater(x,y-12,'护卫','#d8fff0');
  blip(740,0.04,0.028);
}

function makeE(kind,x,y,ang,from,lane){
  const S={
    mite:{hp:8,spd:46,turn:2.3,r:12,dmg:10,ram:22},
    diver:{hp:8,spd:50,turn:2.1,r:13,dmg:9,gun:1,ram:22},
    brute:{hp:22,spd:30,turn:1.1,r:20,dmg:18,ram:34}
  }[kind];
  return {kind,x,y,ang,from,lane:lane,hp:S.hp,max:S.hp,spd:S.spd,turn:S.turn,r:S.r,dmg:S.dmg,ram:S.ram,gun:S.gun||0,
    shot:0.7+Math.random()*0.5,flash:0,ramT:0,cut:0,spent:0};
}
function spawnFlank(w){
  stats.flank++;
  if(w.brute)stats.brute++;
  const side=w.side;
  for(let i=0;i<w.n;i++){
    if(enemies.length>=MAX_E)return;
    const y=ark.y+w.ahead+i*46+rand(-6,10);
    const x=side*(LW/2+36+(i%2)*16);
    const e=makeE(w.brute?'brute':'mite',x,y,-Math.PI/2,'flank',side*(LANE-(i%2)*14));
    enemies.push(e);
  }
}
function spawnFan(){
  stats.fan++;
  const late=ark.y/GOAL>0.9;
  const n=late?3:4;
  for(let i=0;i<n;i++){
    if(enemies.length>=MAX_E)return;
    const u=n===1?0.5:i/(n-1);
    const x=(-1+2*u)*(late?80:130);
    const y=ark.y+Math.min(FOCUS-28,460)+Math.abs(u-0.5)*36;
    const kind=(i===1)?'diver':'mite';
    enemies.push(makeE(kind,x,y,-Math.PI/2,'fan',x*0.35));
  }
}
function updateSpawns(dt){
  const ph=clock<12?0:clock<32?1:clock<58?2:3;
  const prog=ark.y/GOAL, late=prog>0.9;
  const breathe=late?1.28:1;
  sp.flank-=dt;
  if(sp.flank<=0){
    const n=late?3:[3,4,4,3][ph];
    warns.push({kind:'flank',t:1.05,side:sp.side,n,ahead:340+rand(0,40),brute:0});
    const offP=[0.22,0.4,0.48,0.26][ph];
    if(!late&&Math.random()<offP){
      warns.push({kind:'flank',t:0.72,side:-sp.side,n:ph>=2?2:1,ahead:390,brute:0});
    }
    sp.side*=-1;
    sp.flank=[2.15,1.75,1.55,1.9][ph]*breathe;
  }
  sp.fan-=dt;
  if(sp.fan<=0){
    warns.push({kind:'fan',t:0.95,n:late?3:4});
    sp.fan=[8.4,7.2,6.4,7.6][ph]*breathe;
  }
  sp.brute-=dt;
  if(sp.brute<=0&&clock>14&&!late){
    const side=Math.random()<0.5?-1:1;
    warns.push({kind:'flank',t:1.1,side,n:1,ahead:360,brute:1});
    sp.brute=(ph>=2?14:17)*breathe;
  }
  for(let i=warns.length-1;i>=0;i--){
    warns[i].t-=dt;
    if(warns[i].t<=0){
      if(warns[i].kind==='fan')spawnFan(); else spawnFlank(warns[i]);
      warns.splice(i,1);
    }
  }
}
function seek(e,tx,ty,dt){
  const desired=Math.atan2(ty-e.y,tx-e.x);
  const max=e.turn*dt;
  e.ang+=clamp(angDelta(e.ang,desired),-max,max);
  e.x+=Math.cos(e.ang)*e.spd*dt;
  e.y+=Math.sin(e.ang)*e.spd*dt;
}
function steerEnemy(e,dt){
  let tx=ark.x, ty=ark.y+6;
  if(e.spent){
    tx=e.x+Math.sign(e.lane||1)*20;
    ty=ark.y-640;
  }else if(e.from==='flank'&&!e.cut){
    tx=e.lane;
    ty=ark.y+36;
    if(e.y<ark.y+168)e.cut=1;
  }else if(e.from==='flank'){
    tx=ark.x+Math.sign(e.lane||1)*20;
    ty=ark.y+4;
  }else{
    tx=ark.x+clamp(e.lane,-48,48);
    ty=ark.y+8;
  }
  const dist=Math.hypot(e.x-ark.x,e.y-ark.y);
  let mul=1;
  if(!e.spent){
    if(dist>300)mul=0.5;
    else if(dist>170)mul=0.72;
  }else mul=2.4;
  const keep=e.spd;
  e.spd=keep*mul;
  seek(e,tx,ty,dt);
  e.spd=keep;
}
function pushOut(x,y,r){
  for(const rk of rocks){
    if(Math.abs(rk.y-y)>rk.r+r+8)continue;
    let dx=x-rk.x, dy=y-rk.y, d=Math.hypot(dx,dy), min=r+rk.r;
    if(d<min){
      if(d<0.01){dx=1;dy=0;d=1}
      const p=min-d+0.5;
      x+=dx/d*p; y+=dy/d*p;
    }
  }
  return {x,y};
}
function arkTouch(e,pad){
  const dx=(e.x-ark.x)/(30+(pad||0));
  const dy=(e.y-ark.y)/(46+(pad||0));
  return dx*dx+dy*dy<1;
}
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    steerEnemy(e,dt);
    e.flash=Math.max(0,e.flash-dt);
    e.ramT=Math.max(0,e.ramT-dt);
    const bumped=pushOut(e.x,e.y,e.r);
    e.x=bumped.x; e.y=bumped.y;
    if(!e.spent){
      for(const w of wings){
        const p=wingAt(w);
        let dx=e.x-p.x, dy=e.y-p.y, d=Math.hypot(dx,dy), min=12+e.r;
        if(d<min&&d>0.01){e.x+=dx/d*(min-d); e.y+=dy/d*(min-d)}
      }
    }
    const hitF=!e.spent&&player.stun<=0&&Math.hypot(player.x-e.x,player.y-e.y)<BODY+e.r;
    if(hitF&&e.ramT<=0){
      const dx=player.x-e.x, dy=player.y-e.y, L=Math.hypot(dx,dy)||1;
      player.ox+=dx/L*92; player.oy+=dy/L*78;
      e.x-=dx/L*12; e.y-=dy/L*8;
      if(e.kind==='brute')e.hp=Math.max(1,e.hp-1);
      e.flash=0.08;
      e.ramT=0.9;
      player.hitstun=Math.max(player.hitstun,1.05);
      player.ifr=Math.max(player.ifr,0.2);
      stats.rams++;
      burst(player.x,player.y,'#ffb0a0',8,140);
      hurtFighter(e.ram,player.x,player.y,'-'+e.ram);
      clampOff(); syncPlayer();
    }else if(!e.spent&&e.ramT<=0&&arkTouch(e,e.r*0.2)){
      e.spent=1;
      hurtArk(e.dmg,e);
    }
    if(!e.spent&&e.gun&&ebullets.length<10){
      e.shot-=dt;
      if(e.shot<=0&&e.y>ark.y+40&&e.y<ark.y+FOCUS-30){
        e.shot=2.6;
        let a=Math.atan2((ark.y+8)-e.y,ark.x-e.x);
        a+=rand(-0.12,0.12);
        const down=-Math.PI/2;
        a=down+clamp(angDelta(down,a),-0.75,0.75);
        ebullets.push({x:e.x,y:e.y,px:e.x,py:e.y,vx:Math.cos(a)*96,vy:Math.sin(a)*96,life:3.2,r:5,dmg:8});
      }
    }
    if(e.hp<=0||e.y<ark.y-(LH-FOCUS)-70||(e.spent&&e.y<ark.y-90)){
      enemies.splice(i,1);
    }
  }
  for(let i=0;i<enemies.length;i++){
    for(let j=i+1;j<enemies.length;j++){
      const a=enemies[i],b=enemies[j];
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r-1;
      if(d<min&&d>0.01){

function pickThreat(x,y,range,avoid){

    const s=toA*1.2+d*0.22+(e.kind==='brute'?-36:0);

function updateCombat(dt){
  player.flash=Math.max(0,player.flash-dt);
  player.ifr=Math.max(0,player.ifr-dt);
  player.hitstun=Math.max(0,player.hitstun-dt);
  player.stun=Math.max(0,player.stun-dt);
  tgt=pickThreat(player.x,player.y,RANGE,null);
  const face=tgt?Math.atan2(tgt.y-player.y,tgt.x-player.x):Math.PI/2;
  player.aim=damp(player.aim,face,14,dt);
  player.bank=damp(player.bank,clamp(-player.ox*0.004,-0.25,0.25),8,dt);
  fireCd-=dt;
  let tooClose=false;
  if(player.stun<=0){
    for(const e of enemies){
      if(!e.spent&&Math.hypot(e.x-player.x,e.y-player.y)<56){tooClose=true; break}
    }
  }
  const canFire=player.stun<=0&&player.hitstun<=0&&!tooClose;
  if(canFire&&tgt&&fireCd<=0){
    fireCd=0.082;
    const a=Math.atan2(tgt.y-player.y,tgt.x-player.x);
    shoot(player.x+Math.cos(a)*14,player.y+Math.sin(a)*14,a,780,0.28,false);
    player.aim=a;
  }
  for(const w of wings){
    if(w.guard<3){w.guardT+=dt; if(w.guardT>=8){w.guard++; w.guardT=0}}
    const p=wingAt(w);
    const wt=pickThreat(p.x,p.y,WING_RANGE,tgt);
    w.aim=wt?Math.atan2(wt.y-p.y,wt.x-p.x):player.aim;
    w.cd-=dt;
    if(wt&&w.cd<=0&&canFire){
      w.cd=0.34;
      shoot(p.x+Math.cos(w.aim)*10,p.y+Math.sin(w.aim)*10,w.aim,640,0.24,true);
    }
  }
  for(let i=pbullets.length-1;i>=0;i--){
    const b=pbullets[i];
    b.px=b.x; b.py=b.y; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    let hitE=null,hitD=1e9;
    for(const e of enemies){
      if(e===b.ignore)continue;
      if(segHit(b.px,b.py,b.x,b.y,e.x,e.y,e.r+b.r)){
        const d=Math.hypot(e.x-b.x,e.y-b.y);
        if(d<hitD){hitD=d; hitE=e}
      }
    }
    if(hitE){
      hitE.hp-=1; hitE.flash=0.06;
      if(hitE.hp<=0){hitE.hp=0; stats.kills++; burst(hitE.x,hitE.y,'#ffd0ea',8,140)}
      b.hits++; b.ignore=hitE;
      const sp=Math.hypot(b.vx,b.vy)||1;
      b.x=hitE.x+b.vx/sp*(hitE.r+7);
      b.y=hitE.y+b.vy/sp*(hitE.r+7);
      b.px=b.x; b.py=b.y;
      if(b.hits>=(b.wing?1:2))b.life=0;
    }else if(hitRock(b.px,b.py,b.x,b.y)){
      burst(b.x,b.y,'#c5d0e4',4,80);
      b.life=0;
    }
    if(b.life<=0)pbullets.splice(i,1);
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    b.px=b.x; b.py=b.y; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    let dead=b.life<=0;
    if(!dead&&hitRock(b.px,b.py,b.x,b.y)){burst(b.x,b.y,'#ffd0dc',4,70); dead=true}
    if(!dead&&player.stun<=0&&clock-player.blockT>0.05&&segHit(b.px,b.py,b.x,b.y,player.x,player.y,BODY+b.r)){
      player.blockT=clock;
      hurtFighter(6,player.x,player.y,'-6');
      dead=true;
    }
    if(!dead){
      for(const w of wings){
        const p=wingAt(w);
        if(w.guard>0&&segHit(b.px,b.py,b.x,b.y,p.x,p.y,12+b.r)){w.guard--; wingGuard(p.x,p.y); dead=true; break}
      }
    }
    if(!dead&&arkTouch({x:b.x,y:b.y,r:0},8)){hurtArk(b.dmg,b); dead=true}
    if(dead)ebullets.splice(i,1);
  }
}
function keySteer(dt){
  let x=0,y=0;
  if(held['a']||held['arrowleft'])x-=1;
  if(held['d']||held['arrowright'])x+=1;
  if(held['w']||held['arrowup'])y+=1;
  if(held['s']||held['arrowdown'])y-=1;
  if(!x&&!y)return;
  const L=Math.hypot(x,y)||1;
  player.ox+=x/L*PLAYER_SPEED*dt;
  player.oy+=y/L*PLAYER_SPEED*dt;
}
function botSteer(dt){
  if(player.stun>0)return;
  if(!BOT_RAM){
    let nx=0,ny=0,danger=false;
    for(const e of enemies){
      if(e.spent)continue;
      const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
      if(d<118){danger=true; nx+=dx/(d||1); ny+=dy/(d||1)}
    }
    if(danger){
      const L=Math.hypot(nx,ny)||1;
      player.ox+=nx/L*PLAYER_SPEED*dt;
      player.oy+=ny/L*PLAYER_SPEED*dt;
      return;
    }
  }
  let best=null,bestS=1e9;
  const consider=(x,y,eta,bias)=>{
    const s=eta-bias;
    if(s<bestS){bestS=s; best={x,y}}
  };
  for(const e of enemies){
    if(e.spent||e.y<ark.y-20)continue;
    const d=Math.hypot(e.x-ark.x,e.y-(ark.y+16));
    consider(e.x,e.y,d/Math.max(80,e.spd+70),e.kind==='brute'?0.45:0);
  }
  for(const w of warns){
    if(w.kind==='fan')consider(0,ark.y+Math.min(FOCUS-80,400),w.t+0.4,0.08);
    else consider(w.side*(LANE-20),ark.y+220,w.t+0.45,(w.n||1)*0.08+(w.brute?0.35:0));
  }
  let tx=0, ty=170;
  if(best){
    if(BOT_RAM){
      tx=best.x-ark.x; ty=best.y-ark.y;
    }else{
      const dx=best.x-ark.x, dy=best.y-(ark.y+30), L=Math.hypot(dx,dy)||1;
      const along=clamp(L*0.42,80,190);
      tx=dx/L*along - dy/L*78;
      ty=dy/L*along + dx/L*78;
    }

  const ox=tx-player.ox, oy=ty-player.oy, L=Math.hypot(ox,oy)||1;

function step(dt){
  clock+=dt;
  ark.y+=ARK_SPEED*dt;
  ark.x=0;
  ark.hit=Math.max(0,ark.hit-dt);
  for(let i=0;i<3;i++)ark.cab[i]=Math.max(0,ark.cab[i]-dt);
  if(ark.leak){ark.leak.t-=dt; if(ark.leak.t<=0)ark.leak=null}
  lockCam();
  if(BOT)botSteer(dt);
  else if(!drag)keySteer(dt);
  clampOff();
  syncPlayer();
  const pp=pushOut(player.x,player.y,BODY-2);
  player.ox+=pp.x-player.x; player.oy+=pp.y-player.y;
  clampOff(); syncPlayer();
  updateSpawns(dt);
  updateEnemies(dt);
  updateCombat(dt);
  if(!saidGate&&ark.y/GOAL>0.84){saidGate=true; toast('检查点就在前方',2)}
  shake=Math.max(0,shake-dt*11);

  shakeY=(Math.random()-0.5)*shake;
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i]; q.t+=dt; q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(q.t>=q.life)parts.splice(i,1);
  }
  for(let i=nums.length-1;i>=0;i--){
    nums[i].t+=dt; nums[i].y+=26*dt;
    if(nums[i].t>=nums[i].life)nums.splice(i,1);
  }
  tip.t=Math.max(0,tip.t-dt);
  if(ark.hp<=0){state='lose'; endTitle='方舟被毁'; endSub='护送失败'; burst(ark.x,ark.y,'#ff5577',22,220); return}
  if(ark.y>=GOAL){state='win'; endTitle='方舟抵达检查点'; endSub='护住方舟到达前方'; burst(ark.x,ark.y,'#ffe27a',16,160)}
}

    const hot=eta<0.7;
    ctx.strokeStyle=hot?'#ff3b55':'#ffd15a';
    ctx.globalAlpha=hot?0.95:0.8;
    ctx.lineWidth=hot?5:3.5;
    ctx.beginPath(); ctx.arc(0,0,62,a-0.48,a+0.48); ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*78,Math.sin(a)*78);
    ctx.lineTo(Math.cos(a-0.22)*64,Math.sin(a-0.22)*64);
    ctx.lineTo(Math.cos(a+0.22)*64,Math.sin(a+0.22)*64);
    ctx.fill();
  }
  if(ark.leak){
    const a=ang[ark.leak.side];
    ctx.globalAlpha=clamp(ark.leak.t/1.05,0,1);
    ctx.strokeStyle='#ff2048'; ctx.lineWidth=8;
    ctx.beginPath(); ctx.arc(0,0,50,a-0.85,a+0.85); ctx.stroke();
    ctx.globalAlpha=1;
    txt(LEAK[ark.leak.side], Math.cos(a)*92, Math.sin(a)*92, 16,'#ffd5de',4);
  }
  ctx.restore(); ctx.globalAlpha=1;
}
function drawGate(){
  const dist=GOAL-ark.y;
  const [sx,sy]=w2s(0,GOAL);
  const [xL]=w2s(-LW/2+18,0), [xR]=w2s(LW/2-18,0);
  if(sy>-40&&sy<LH+40){
    ctx.save(); ctx.translate(0,sy);
    ctx.fillStyle='rgba(130,230,255,.2)'; ctx.fillRect(xL,-8,xR-xL,16);
    ctx.fillStyle='#e7fbff'; ctx.fillRect(xL,-2,xR-xL,4);
    txt('检查点',sx,-24,16,'#f3fdff',3);
    ctx.restore();
    return;
  }
  if(dist>0&&dist<1800)txt('▲  检查点  '+Math.max(1,Math.ceil(dist/ARK_SPEED))+'s',LW/2,safe.top+128,13,'#c9f6ff',3);
}
function drawConvoy(){
  for(const w of wings){
    const p=wingAt(w);
    blit(w.kind,p.x,p.y,-(w.aim-Math.PI/2),0.82,false);
  }
  blit('ark',ark.x,ark.y,0,1,ark.hit>0);
  blit('fighter',player.x,player.y,-(player.aim-Math.PI/2)+(player.bank||0),1,player.flash>0);
}
function drawEnemies(){
  const list=enemies.slice().sort((a,b)=>b.y-a.y);
  for(const e of list){
    blit(e.kind,e.x,e.y,-(e.ang-Math.PI/2),e.kind==='brute'?1.05:1,e.flash>0);
    if(e.kind==='brute'){
      const [sx,sy]=w2s(e.x,e.y);
      const f=clamp(e.hp/e.max,0,1);
      ctx.fillStyle='#140810'; ctx.fillRect(sx-14,sy-26,28,4);
      ctx.fillStyle='#ffb15a'; ctx.fillRect(sx-14,sy-26,28*f,4);
    }
  }
}
function drawBullets(){
  for(const b of pbullets){
    const [x,y]=w2s(b.x,b.y),[px,py]=w2s(b.px,b.py);
    ctx.strokeStyle=b.wing?'#9dffe0':'#e7fbff'; ctx.lineWidth=b.wing?2:3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke();
  }
  for(const b of ebullets){
    const [x,y]=w2s(b.x,b.y);
    ctx.fillStyle='#2a0018'; ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fill();
    ctx.fillStyle='#ff3b6b'; ctx.beginPath(); ctx.arc(x,y,4.2,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,1.8,0,7); ctx.fill();
  }
}
function drawFx(){
  for(const q of parts){
    const [x,y]=w2s(q.x,q.y);
    ctx.globalAlpha=clamp(1-q.t/q.life,0,1);
    ctx.fillStyle=q.col; ctx.beginPath(); ctx.arc(x,y,q.s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const n of nums){
    const [x,y]=w2s(n.x,n.y);
    ctx.globalAlpha=clamp(1-n.t/n.life,0,1);
    txt(n.txt,x,y,n.size||15,n.col,3);
  }
  ctx.globalAlpha=1;
}
function bar(x,y,w,h,f,c1,c2){
  roundRect(x,y,w,h,h/2); ctx.fillStyle='#14123a'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=OUT; ctx.stroke();
  if(f>0){
    roundRect(x+2,y+2,Math.max(4,(w-4)*clamp(f,0,1)),h-4,(h-4)/2);
    const g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,c1); g.addColorStop(1,c2); ctx.fillStyle=g; ctx.fill();
  }
}
function drawHud(){
  const lo=ark.hp/ARK_MAX<=0.34;
  const y0=safe.top+12;
  txt('走廊试玩',16,y0+8,13,'#c9d7ff',2,'left',800);
  txt('v3',78,y0+8,12,'#ffe27a',2,'left',800);
  const L=layout();
  roundRect(L.pause.x,L.pause.y,L.pause.w,L.pause.h,10);
  ctx.fillStyle='rgba(12,16,40,.72)'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#9fd0ff'; ctx.stroke();
  txt('Ⅱ',L.pause.x+L.pause.w/2,L.pause.y+L.pause.h/2+1,16,'#fff',0);
  const f=clamp(ark.hp/ARK_MAX,0,1);
  txt('方舟',16,y0+34,14,'#fff',3,'left');
  bar(58,y0+26,200,14,f,lo?'#ffb0b8':'#d6ffb0',lo?'#ff2a40':'#2fc23a');
  txt(Math.ceil(ark.hp)+'',268,y0+33,13,'#fff',2,'left',800);
  const fh=clamp(player.hp/FIGHTER_MAX,0,1);
  const flo=player.hp/FIGHTER_MAX<=0.36||player.stun>0;
  txt('战机',16,y0+54,12,flo?'#ffd0d6':'#d7f4ff',2,'left',800);
  bar(58,y0+48,160,10,fh,flo?'#ffb0b8':'#bfefff',flo?'#ff4d6a':'#3aa0ff');
  if(player.stun>0)txt('重伤',224,y0+53,12,'#ffb0bc',2,'left',800);
  const p=clamp(ark.y/GOAL,0,1);
  txt('护住方舟到达前方',16,y0+74,13,'#d5ecff',2,'left',800);
  txt(Math.round(p*100)+'%',LW-16,y0+74,14,'#fff',3,'right');
  txt('击落 '+stats.kills,16,y0+94,12,'#ffe7a8',2,'left',700);
  if(!draggedOnce&&!BOT&&clock<8){
    txt('飞到亮起的一侧开火 · 硬撞会受伤',LW/2,LH-safe.bot-16,13,'#e7f2ff',3);
  }
  if(tip.t>0){
    ctx.globalAlpha=clamp(tip.t,0,1);
    txt(tip.txt,LW/2,y0+116,15,'#fff',3);
    ctx.globalAlpha=1;
  }
  if(DBG)txt(Math.round(fps)+'  e'+enemies.length+'  '+clock.toFixed(0)+'s',10,LH-12,11,'#9ab',0,'left',700);
}
function drawPlayfield(){
  ctx.save(); ctx.translate(shakeX,shakeY);
    drawWorldBackdrop();
    drawRocks();
  if(state==='title'){
    const [ax,ay]=s2w(LW/2,FOCUS);
    blit('ark',ax,ay,0,1,false);
    const bob=Math.sin(demoT*1.4)*70;
    const [fx,fy]=s2w(LW/2+bob,FOCUS-130);
    blit('fighter',fx,fy,Math.sin(demoT)*0.4,1,false);
    blit('sand',fx-40,fy+28,0.2,0.8,false);
    blit('teal',fx+40,fy+24,-0.2,0.8,false);
    for(let i=0;i<4;i++){
      const [x,y]=s2w(70+i*84,48);
      blit(i===2?'diver':'mite',x,y,0,1,false);
    }
    blit('mite',28,FOCUS-40,0.6,1,false);
    blit('mite',LW-28,FOCUS-20,-0.6,1,false);
  }else{
    drawGate();
    drawThreats();
    drawEnemies();
    drawBullets();
    drawConvoy();
    drawFx();
  }
  ctx.restore();
}
function drawTitle(){
  const dy=(LH-760)*0.32;
  const L=layout();
  txt('星港护航',LW/2,112+dy,16,'#9fd0ff',3,'center',800);
  txt('走廊试玩',LW/2,162+dy,42,'#fff',8);
  txt('护住方舟到达前方',LW/2,214+dy,20,'#ffe27a',4);
  roundRect(L.card.x,L.card.y,L.card.w,L.card.h,18);
  ctx.fillStyle='rgba(12,16,44,.9)'; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle=OUT; ctx.stroke();
  const lines=['开阔星域，提前开火','飞到亮起的一侧射击','硬撞和挡弹都会掉血','漏掉的才会打中方舟'];
  lines.forEach((s,i)=>txt(s,LW/2,L.card.y+28+i*34,16,'#e7f1ff',3));
  txt('约 75 秒 · 方舟被毁则失败',LW/2,L.card.y+L.card.h-40,13,'#d5e4ff',2,'center',700);
  txt('v3 · 独立试玩，不改主线',LW/2,L.card.y+L.card.h-18,12,'#9eb0d4',0,'center',700);
  drawBtn(L.start);
}
function drawEnd(){
  ctx.fillStyle='rgba(4,6,16,.72)'; ctx.fillRect(0,0,LW,LH);
  const L=layout();
  const top=L.retry.y-168;
  roundRect(32,top,326,L.back.y-top+L.back.h+28,20);
  ctx.fillStyle='rgba(12,16,46,.96)'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=OUT; ctx.stroke();
  txt(endTitle,LW/2,top+46,28,'#fff',6);
  txt(endSub,LW/2,top+90,18,state==='win'?'#ffe27a':'#ffb0bc',4);
  txt(state==='win'?('击落 '+stats.kills+' · 护卫 '+stats.blocks):'再护一次方舟',LW/2,top+122,14,'#d5ecff',2,'center',700);
  drawBtn(L.retry);
  drawGhostBtn(L.back);
}
function drawPause(){
  ctx.fillStyle='rgba(4,6,16,.62)'; ctx.fillRect(0,0,LW,LH);
  const b={x:70,y:LH*0.46,w:250,h:60,label:'继续'};
  const q={x:108,y:LH*0.46+76,w:174,h:46,label:'返回标题'};
  roundRect(40,LH*0.46-88,310,76+46+70,20);
  ctx.fillStyle='rgba(12,16,46,.96)'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=OUT; ctx.stroke();
  txt('已暂停',LW/2,LH*0.46-40,32,'#fff',6);
  drawBtn(b); drawGhostBtn(q);
  pauseBtns={resume:b,quit:q};
}
let fps=60,frames=0,fpsT=0;
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#070914';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,DPR*OFFX,DPR*OFFY);
  if(state!=='title')lockCam();
  drawPlayfield();
  if(state==='title')drawTitle();
  else if(state==='play')drawHud();
  else if(state==='pause'){drawHud(); drawPause()}
  else drawEnd();
}
let last=performance.now(), simAcc=0;
function loop(now){
  const raw=Math.min(0.05,(now-last)/1000); last=now;
  frames++; if(now-fpsT>500){fps=frames*1000/(now-fpsT); frames=0; fpsT=now}
  if(state==='title'){
    demoT+=raw; cam.y+=raw*72; cam.x=0;
  }else if(state==='play'){
    simAcc+=raw*TIMESCALE;
    let n=0;
    while(simAcc>=1/60&&n<36){step(1/60); simAcc-=1/60; n++}
  }else{
    stepFx(raw); simAcc=0;
  }
  draw();
  requestAnimationFrame(loop);
}
function onKey(e,down){
  const k=e.key.toLowerCase();
  if(down){
    unlockAudio();
    held[k]=true;
    if(k==='escape'){if(state==='play')state='pause'; else if(state==='pause')state='play'}
    if((k===' '||k==='enter')&&(state==='title'||state==='win'||state==='lose'))begin();
    if((k===' '||k==='enter')&&state==='pause')state='play';
  }else delete held[k];
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
}
addEventListener('keydown',e=>onKey(e,true));
addEventListener('keyup',e=>onKey(e,false));
addEventListener('blur',()=>{for(const k in held)delete held[k]; drag=null});
cv.addEventListener('pointerdown',e=>{
  unlockAudio();
  cv.setPointerCapture?.(e.pointerId);
  const [x,y]=toLogical(e);
  const L=layout();
  if(state==='title'){if(hit(L.start,x,y))begin(); e.preventDefault(); return}
  if(state==='win'||state==='lose'){uiDown={id:e.pointerId,x,y}; e.preventDefault(); return}
  if(state==='pause'){
    if(pauseBtns&&hit(pauseBtns.resume,x,y))state='play';
    else if(pauseBtns&&hit(pauseBtns.quit,x,y))state='title';
    e.preventDefault(); return;
  }
  if(hit(L.pause,x,y)){state='pause'; e.preventDefault(); return}
  drag={id:e.pointerId,sx:x,sy:y,ox:player.ox,oy:player.oy};
  e.preventDefault();
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id||state!=='play')return;
  const [x,y]=toLogical(e);
  player.ox=drag.ox+(x-drag.sx)*1.08;
  player.oy=drag.oy-(y-drag.sy)*1.08;
  draggedOnce=true;
  clampOff(); syncPlayer();
  e.preventDefault();
},{passive:false});
function endPointer(e){
  if(uiDown&&e.pointerId===uiDown.id&&(state==='win'||state==='lose')){
    const [x,y]=toLogical(e);
    const L=layout();
    if(hit(L.retry,x,y))begin();
    else if(hit(L.back,x,y))state='title';
  }
  if(drag&&e.pointerId===drag.id)drag=null;
  uiDown=null;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('contextmenu',e=>e.preventDefault());
function countFixed(){
  let n=0;
  for(const el of document.querySelectorAll('*'))if(getComputedStyle(el).position==='fixed')n++;
  return n;
}
window.__corridor={
  get snap(){
    let fixed=0; try{fixed=countFixed()}catch(err){}
    const kinds={};
    for(const e of enemies)kinds[e.from]=(kinds[e.from]||0)+1;
    return {
      state,clock:+clock.toFixed(2),dpr:DPR,lh:LH,css:[CSS_W,CSS_H],
      position:getComputedStyle(cv).position,fixed,
      usedVisualViewport:!!window.visualViewport,
      player:{x:+player.x.toFixed(1),y:+player.y.toFixed(1),ox:+player.ox.toFixed(1),oy:+player.oy.toFixed(1),hp:+player.hp.toFixed(1),max:FIGHTER_MAX,stun:+player.stun.toFixed(2)},
      ark:{x:+ark.x.toFixed(1),y:+ark.y.toFixed(1),hp:+ark.hp.toFixed(1),max:ARK_MAX},
      cam:{x:+cam.x.toFixed(1),y:+cam.y.toFixed(1)},
      progress:+(ark.y/GOAL).toFixed(3),
      enemies:enemies.length,kinds,stats:{...stats},
      endTitle,endSub,goal:GOAL,
      leak:ark.leak?ark.leak.side:''
    };
  },
  buttons(){return layout()},
  clientOf(lx,ly){
    const r=cv.getBoundingClientRect();
    return {x:r.left+OFFX+lx*SCALE,y:r.top+OFFY+ly*SCALE};
  }
};
if(DBG){
  window.__corridor.start=begin;
  window.__corridor.killArk=()=>{if(state!=='play')begin(); ark.hp=0};
  window.__corridor.reach=()=>{if(state!=='play')begin(); ark.y=GOAL+5};
}
resize();
if(DBG&&Q.get('go')==='1')begin();
requestAnimationFrame(loop);
</script>
